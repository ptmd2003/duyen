<script>
const POSTS = [{"s":"cach-don-dung-luong-macbook","t":"cách dọn dung lượng macbook","d":"2026-02-20","c":"notes","p":["nhưng mà tui mới dọn được có 50gb system data thôi... toi vẫn không biết làm sao dọn hết 200gb còn lại :)"]},{"s":"thu-vien-sach-noi-danh-cho-nguoi-mu","t":"thư viện sách nói dành cho người mù","d":"2025-12-26","c":"notes","p":["vô tình tìm kiếm thư viện để đi hôm nay, mình gặp phải thư viện sách nói cho người mù và 1001 sách nói miễn phí. Mở mang tầm mắt, biết ơn cuộc đời 🙏","Nếu chỉ tìm sách nói chắc là mình chỉ thấy “sách nói” phiên bản tốn tiền, nhưng ở đây mọi thứ hoàn toàn thiện nguyện mình vô cùng cảm kích 🥹"]},{"s":"wordpress-icloud-books-epub-convert","t":"wordpress, icloud books & epub convert","d":"2025-12-13","c":"notes","p":["#1. file icloud books không thể convert sang PDF được vì nó đã là file hệ thống, dù đuôi file vẫn là .epub nhưng lúc cố gắng convert thì mặc định sẽ chỉ convert được sang file nén (zip, rar, 7z)","#2. muốn convert file epub thì dùng file gốc, epub tiếng Nhật khi convert sang pdf dễ bị lỗi - dùng calibre để convert là chuẩn nhất","#3. WP theme có setup sẵn blog home, nếu tạo trang A với design A, apply blog home sẽ bị thay thế setup từ theme chứ không phải design A. Có thể copy design A sang trang mẫu của theme trước, lưu mẫu của theme, sau đó quay về trang A set blog home."]},{"s":"cach-nha-ngheo-hoc-tieng-nhat","t":"Cách nhà nghèo học tiếng Nhật","d":"2025-03-16","c":"japanese","p":["Tui phải viết bài này bằng tất cả sự nghèo khó đáng tự hào của tui mọi người à =))","Chuyện là mình đang học tiếng Nhật, và với kinh nghiệm học ngoại ngữ trước đây, mình có một niềm tin mãnh liệt là việc luyện phim/show có thể giúp mình học nhanh hơn, giống như hồi mình luyện cả bộ series How I Met Your Mother và Friends vậy á.","Nhưng mà như mọi người theo học tiếng Nhật đều biết, cách nhanh nhất để xem phim Nhật HD có sub Nhật là dùng Netflix + extension. MÀ MÌNH NGHÈO MÀ MN :((((","Thật ra tiền Netflix thì cũng không đáng bao nhiêu, nhưng mình mua xong thì mình coi toàn những phim khác chứ không có học hành vì nghĩ tốn tiền mua rồi phải xài cho đáng :)","NHƯNG MÌNH ĐÃ TÌM RA MỘT CÁCH KHÔNG TỐN TIỀN!!!! (chỉ có xíu nhược điểm không đáng kể là hơi phức tạp, but worth it!!)","Vào việc!","1. Tải Utorrent tại đây","2. Truy cập https://nyaa.land/ để tìm phim/show cần xem (góc phải)","3. Tải file phim về, đuôi sẽ là đuôi .mkv (nên sẽ cần có bước 4 để xem được file này nhé)","4. Tải App xem được file .mkv. Mọi người có thể chọn app nào cũng được, riêng mình thì recommend dùng OmniPlayer nếu dùng Mac tại đây vì sẽ có sub song ngữ nếu file tải trên đã có 2 file sub nha (thường thì sẽ có á)","5. Main sub của mình sẽ là Sub Nhật, nhưng mọi người có thể chọn thêm Sub bổ sung (Tiếng Anh) theo ví dụ dưới đây nha.","Xong rồi thì mời bà con xem phim thôi ạ :>","Về sau mọi người cần coi phim nào thì chỉ cần lặp lại từ Buớc 2 đến bước 3 thôi là okk rồi.","Nhược điểm vì là file offline nên sẽ tốn dung lượng của mọi người, nhưng ưu điểm thì quá là xứng đáng với mình, thêm nữa do offline nên mình cũng có thể xem được mọi lúc nữa.","Thật ra nếu mọi người có điều kiện thì mua Netflix + dùng Language Reactor vẫn ổn áp quá trời á, và mình cũng khuyến khích mọi người nên dùng Netflix vì nhanh hơn, tiện hơn và còn support nhà sản xuất nữa.","Còn mình thì do vừa nghèo vừa bị cám dỗ bởi rất nhiều phim khác kể cả có mua Netflix nên là mới có cách tà ma ngoại đạo như thế này :< (một phần mình cũng tin rằng việc học không nên bị giới hạn bởi điều kiện kinh tế)","Cách này tui chưa thấy ở đâu hướng dẫn hết nên là note lại để không quên mất, mong là sau post này không bị bế sập page :|","Chúc mọi người học hành bội thu :>","Phần 2 mình sẽ cố gắng tìm thêm cách đọc được Manga/văn học Nhật bằng tiếng Nhật ~"],"q":"Tui phải viết bài này bằng tất cả sự nghèo khó đáng tự hào của tui mọi người à =))"},{"s":"khong-co-sau-do","t":"Không có sau đó","d":"2024-10-13","c":"diary","p":["\"Sau tất cả, điều quan trọng nhất còn lại là gì?\" đã là bài viết cuối của mình từ tháng 3/2024.","Nhiều thứ đã thay đổi. Rất nhiều.","Mình bắt đầu một công việc mới, sống tại một thành phố mới, gặp thêm những người bạn mới, và bắt đầu một hành trình mới.","Thế nhưng, không có sau đó.","Một khung cửa sổ đầy nắng, một căn hộ trung tâm, một tách cà phê mỗi sáng, và vẫn là một cô gái đầy những hoài nghi về con đường sắp tới.","Thở dài. Thật ra cũng chẳng có nhiều khác biệt.","Đọc lại những bài blog cũ, nhìn lại cô gái hào hứng những ngày đầu viết, và cô gái ủ dột với những bài viết đầy uncertainty 1 năm trở lại đây, khiến mình có chút buồn cười lại thấy bản thân hơi đáng thương. Chẳng ai làm gì nhưng suốt ngày cứ sầu não mãi.","Mình đã định tiếp theo sẽ tự chê mình thật thậm tệ một cách thẳng thắng, rồi chợt thấy à thì ra chính mình đã chẳng thật sự trân trọng bản thân mình. Thế nên mình cứ bất mãn, cứ hoài nghi, mà 90% là trách móc mình sao không chịu nỗ lực nhiều hơn, không chịu siêng năng lên, cày cuốc cật lực vào.","Nhưng mình lại không muốn cứ tiếp tục như thế.","Vẫn là những mâu thuẫn lo lắng chẳng đâu vào đâu. Vẫn là những câu hỏi hiện sinh luẩn quẩn trong đầu. Vẫn là những e ngại, những trì hoãn, những phân vân. Và nếu cứ thế thì sẽ mãi là mình, không có sau đó.","Thế thì tại sao lại không kết thúc mọi thứ ở hiện tại?","Kết thúc những vấn đề, những băn khoăn, những trăn trở không có lời giải đáp. Nếu đã không có lời giải rồi, thì cứ vứt mọi thứ sang một bên là được.","Không cần phải suy nghĩ nhiều về việc ngày mai làm gì, tương lai ra sao. Bởi vì ngay lúc này, mình có thể chọn sống một cuộc sống khác.","Để mình không còn phải cứ u uất mệt mỏi vì bản thân mình chưa đủ tốt, chưa đủ đầu tư cho tương lai.","Để mình sống một cuộc sống mà mình sống cho hiện tại, cho bản thân, cho mình của những ngày đã đi qua, chứ không phải là những ngày của sau đó.","Để mình chọn cách yêu thương bản thân mình đúng nghĩa, chọn cách quan tâm đến những điều nhỏ bé, dung dưỡng những thói quen tốt, và đầu tư vào những đam mê đã luôn tồn tại dù bao lần từ bỏ.","Để mình khiến đứa trẻ 7 tuổi, 10 tuổi, thậm chí 15 tuổi trong mình tự hào.","Để mình được sống cho mình. Được khao khát thức dậy mỗi buổi sáng.","Đằng nào thì tương lai cũng luôn là một ẩn số, nên thay vì đau đầu, mình cứ tập trung vào những điều khiến mình hạnh phúc thôi vậy.","Dù sao thì đó cũng là châm ngôn của chiếc blog này mà đúng hong?"],"q":"Để mình khiến đứa trẻ 7 tuổi, 10 tuổi, thậm chí 15 tuổi trong mình tự hào."},{"s":"sau-tat-ca-dieu-quan-trong-nhat-con-lai-la-gi","t":"Sau tất cả, điều quan trọng nhất còn lại là gì?","d":"2024-03-29","c":"diary","p":["Sau tất cả, điều quan trọng nhất còn lại là gì?","Đó là câu hỏi đầu tiên xuất hiện trong đầu mình giữa một chiều Chủ Nhật mưa (bão) tầm tã, với cà phê, cửa sổ và một bản nhạc pop.","Một cặp đôi dưới hiên","Một xe rác ướt sũng","Và một đứa trẻ mới lớn phía sau ô cửa.","Trước ánh đèn neon nhấp nháy và cái lạnh của trời đông, mọi thứ dường như nhoè đi, để lại mình với những suy nghĩ mơ hồ không chút trật tự.","\"Sau tất cả, điều quan trọng nhất còn lại là gì?\"","Con người luôn sống với những ràng buộc, hữu hình có, vô hình có, từ chuyện nhà cửa vật chất miếng cơm manh áo cho đến những mối quan hệ xã hội bạn bè người thân, chưa kể đến những định kiến, quy tắc, luật lệ của cộng đồng, nhưng thật khó để trả lời cho bản thân mình câu hỏi vì sao.","Vì sao lại như vậy?","Mình cứ đi làm, cứ nỗ lực, cứ bị chà đạp, cứ đứng dậy.","Cứ mệt mỏi, cứ gắng lên, cứ khóc thầm, cứ vỗ mặt.","Những điều bất như ý cứ chất chồng không thoát ra được.","Mình chỉ muốn bỏ mặc, muốn nằm ườn ra đó, muốn thở dài, lại chỉ muốn tự vỗ về bản thân. Ngày qua ngày ôm mình an ủi phải tích cực, nhưng đổi về chỉ là những kì vọng ảo về hiện tại xám ngoét.","Nhìn những điều bình dị trước mắt rồi nhìn lại mình đầy phờ phạc, mình tự hỏi bản thân rốt cuộc đang cố vì điều gì. Có thật sự phải gánh gồng như thế hay không? Có thật sự phải dối lòng rằng mình vẫn ổn, mỗi ngày, chỉ để đổi lấy những bất an này hay không?","Phải chăng tất cả những gì mình cần, đến cuối cùng, cũng chỉ là cảm giác an yên đằng kia, thay vì những điều xa hoa phù phiếm không có thực?","Mình nghĩ mình đã chạm đáy, rất nhiều lần. Bằng cách nào đó, dù vững vàng hay ngả nghiêng, mình vẫn đứng dậy.","À, vì ít ra, mình vẫn còn có gia đình.","Ít ra mình còn có mẹ cạnh bên.","Ít ra mình còn có bạn bè dỗ dành.","Và ít ra, mình không cô đơn.","Mình không muốn mang theo câu hỏi mơ hồ như thế đi suốt quãng đường còn lại. Thay vào đó, mình muốn mình dũng cảm dùng nó làm bàn đạp cho mình xuất phát, chạy ra khỏi vạch kẻ an toàn giữ chân mình suốt thời gian qua.","Đường chỉ tay của mình luôn ngắn hơn người khác rất nhiều, và mình không muốn lãng phí thời gian của mình cho những điều độc hại.","Sau tất cả, nếu những gì ở lại chỉ là nỗi buồn và sự ngờ vực bản thân, thì việc chấp nhận rủi ro để đón những thử thách mới, hẳn sẽ là một sự lựa chọn đúng đắn hơn, nhỉ?"],"q":"Ít ra mình còn có mẹ cạnh bên."},{"s":"tan-man-cuoi-thang-8-nhung-ngay-xinh","t":"Tản mạn cuối tháng 8 - Những ngày xinh","d":"2023-08-29","c":"diary","p":["Mình đã định làm một chút gì đó mới mẻ cho chiếc blog nhỏ của mình, như là lập một topic mỗi ngày một prompt để khuyến khích bản thân viết nhiều nhiều vào, thế nhưng lại thấy mình chưa viết tản mạn cho tháng 8, và cũng chỉ còn vỏn vẹn vài ngày nữa là bước sang tháng 9 rồi, nên phải tranh thủ viết, kẻo lại bỏ lỡ một đoạn thời gian đầy niềm vui.","Thường thì mình hay viết mỗi khi buồn hơn là lúc vui, hẳn là lúc vui thì mình đã bận tận hưởng thay vì ngồi im lặng suy nghĩ như những lúc buồn. Kết quả là mỗi lần mở blog lên mình chỉ thấy toàn những điều tiêu cực thôi, chả muốn chút nào. Nên là vào những lúc rảnh được xíu xiu như thế này, mình lại mong bản thân có thể ghi lại tất cả mọi khoảnh khắc nhiều hơn, trọn vẹn hơn, để chiếc blog của mình thêm *bling bling* như một cuốn nhật ký vậy á.","Tháng vừa rồi của mình trôi qua yên bình như một chiều hạ bên bờ sông, vì mọi thứ cứ êm ả như thế nào ý. Mình pass probation nè, thấy hạnh phúc trong công việc nè, thấy cuộc sống nhiều may mắn nè, và thấy mình trưởng thành hơn, làm được nhiều việc hơn mỗi ngày nữa. Có lẽ là vì vậy mà, mình không biết viết gì những lúc như thế này hết, vì mình thấy mình quá là \"enjoy cái mô mừn\" này rồi í :v","Thôi thì mình sẽ kể cho mọi người nghe một chiếc mô mừn cũng được xem là \"cột mốc\" đáng nhớ trong tháng vừa rồi nha.","Bạn mình đám cưới.","Lần đầu tiên trong cuộc đời, cho đến thời điểm này của mình, mình có một người bạn mời đi đám cưới. Và với mình thì điều này thật sự là một điều đáng nói í, giống như là sự khẳng định cho việc tụi mình đã đến tuổi thành gia lập thất rồiii. Thật lòng thì cảm giác trở thành khách mời thật sự trong đám cưới của một người bạn là một cảm giác rất khác í, khác xa tất cả những lần mình đi đám cưới cùng mẹ trước đây, hay ngay cả là đám cưới của những anh chị em họ hàng thân thiết từ đó đến giờ vậy. Lần đầu tiên trong đời, mình dự đám cưới mà book makeup, lần đầu tiên thuê váy, và cũng là lần đầu tiên thật sự góp mặt trong đám cưới của cô dâu. Nên, với mình đó là một trải nghiệm có một không hai trong đời, và hôm đó mình thấy mình cũng xink lắm ahjhj hong bỏ công đầu tư :>","Cũng hong biết viết gì thêm vì dạo này mình bị yêu đời á, thôi thì nào tìm thấy topic deep deep mình lại trồi lên tám chuyện với mọi người nha ~","Không ngờ là có ngày một đứa ưa nói như mình lại không thể viết quá 2000 từ cho một bài blog, shock, mức độ vô tri của toi đã lên một tầm cao mới rồi hụ hụ","Dù vậy thì, sống vui mới là quan trọng!","Chúc mọi người một kì nghỉ lễ nhiều niềm vui nhaaa"],"q":"Lần đầu tiên trong đời, mình dự đám cưới mà book makeup, lần đầu tiên thuê váy"},{"s":"tan-man-cuoi-thang-7-nhung-ngay-he-yen-a","t":"Tản mạn cuối tháng 7 - Những ngày hè yên ả","d":"2023-07-29","c":"diary","p":["Nhắc đến mùa hè Sài Gòn là không thể thiếu những cơn mưa rào bất chợt nối tiếp những ngày nắng gắt đầu hạ. Tháng 7, trời cũng đã chớm vào đông, mưa ngày càng nhiều và trời cũng đã dần lạnh hơn mỗi sớm.","Dạo gần đây mình bắt đầu viết nhật ký thường hơn rồi, nhưng giờ viết tản mạn lại cảm thấy không biết phải viết gì, cũng không hẳn là không có gì để viết, có lẽ là không biết bắt đầu từ đâu thì đúng hơn.","Tháng 7, tháng thứ hai và cũng là tháng kết thúc thời gian thử việc của mình. Với mình, hai tháng này chắc hẳn là hai tháng tuyệt vời nhất từ đầu năm tới giờ, và đâu đó mình vẫn cảm thấy những sự lựa chọn trước đó của mình đã thật sự chính xác. Mình nhớ rằng đã từng nghe một ai đó nói, “Không bao giờ có sự lựa chọn đúng nhất“, chỉ có tự chúng ta làm cho lựa chọn đó đúng mà thôi. Trong khoảng 1 năm trở lại đây, mình đã trải qua vô số những sự lựa chọn, có cái khiến mình suy sụp, có cái khiến mình hạnh phúc, nhưng mình tin rằng tất cả những sự lựa chọn đó, đều giúp mình học được những bài học cực kì quý báu, để mình biết trân trọng bản thân mình hơn, và học cách dũng cảm đối mặt với những khó khăn trong cuộc sống.","Nói nghe lớn lao quá ha, nhưng trong chặng đường này, cho đến thời điểm hiện tại, mình mới nhận ra là mình vẫn luôn thật sự may mắn.","Giữa những cơn mưa xối xả cuối hè, trong lòng mình lại thấy yên ả đến lạ.","Tháng 7, bạn của mình sắp cưới, con của người yêu cũ sắp thôi nôi, còn mình thì vẫn chọn độc thân hạnh phúc. Mình vẫn thấy mình khá bận rộn, nếu không phải là công việc thì cũng là những dự án cá nhân, thời gian rảnh cũng chỉ đủ dành cho gia đình, bạn bè, và dành cho bản thân. Cũng không hẳn là mình không muốn hay không trông đợi vào một mối quan hệ nào, chỉ là mình cảm thấy mình bận quá, không rảnh yêu đương, nếu có thì người ấy chắn chắn cũng phải bận như mình, vì ở thời điểm hiện tại, mình cũng chẳng có mấy thời gian để chăm chút cho những mối quan hệ. Hẳn là với mình bây giờ, yêu bản thân thôi là đã đủ bận rồi.","Thật lòng mà nói thì mình viết tới đây là hết văn vì gần đây không siêng đọc nữa. Nên là, hẹn gặp lại mọi người vào một ngày khác, và chắc chắn là sắp tới mình sẽ có siêu nhiều thứ để viết luôn á.","Vậy thui, chúc mọi người cuối tuần yên ả nha ~"],"q":"Giữa những cơn mưa xối xả cuối hè, trong lòng mình lại thấy yên ả đến lạ."},{"s":"hom-nay-minh-tron-23-tuoi","t":"Hôm nay mình tròn 23 tuổi","d":"2023-07-09","c":"diary","p":["(Reup từ một chiếc blog của toi hồi sinh nhật mình từ tháng 3 nên timeline sẽ không fit với những gì đang xảy ra ở hiện tại)","Thật ra là cũng hong có gì nhiều, chỉ là tui nhận ra mình đã bước qua U22 nên muốn trồi lên để dài dòng xíu xiu, viết vài lời tạm biệt tuổi 22 và chào đón tuổi mới một cách nghiêm túc hơn","Năm vừa qua của mình là một năm siêu nhiều biến động, mặc dù mình dự đoán là tuổi mới này của mình cũng biến động nhiều hong kém gì tuổi 22, nhưng mình sẽ kỳ vọng những chuyển biến tích cực sẽ diễn ra sắp tới.","Đến thời điểm này đôi lúc mình vẫn chưa thích nghi được với việc bản thân đã “quá lứa lỡ thì” so với các bạn sinh viên, mình cứ nghĩ mình mới 18 thui, còn ham chơi lười biếng dữ lắm. Nhưng vì mình đã bắt đầu đến cái tuổi mà mọi người chuẩn bị thành gia lập thất, có sự nghiệp ổn định, lương 20 củ,… mình mới nhận ra là mọi thứ xung quanh đang dần thay đổi rất nhiều, nên là mình cũng cần phải nỗ lực hơn nữa để bắt kịp mọi người (hoặc đúng hơn là bắt kịp với những mục tiêu mình đặt ra).","Dù với nhiều người quen của mình thì mình đã đi lùi chục bước, từ phú bà đầu tiên đạt thu nhập 1000$ trong đám đến một cu gái thất nghiệp tuổi 22, nhưng mình biết có những sự lựa chọn là bài học mà mình phải học. Bằng cách nào đó, mình nhận ra đồng tiền không còn là thước đo cho sự thành công của mình nữa.","Mình từng đặt mục tiêu thu nhập của mình là 10tr, 20tr, rồi 50tr,… tương ứng với lúc mới ra trường, lên senior, manager,… Nhưng mình chưa bao giờ thật sự nhìn sâu vào bản thân để thật sự thấy mình là ai trong những năm tiếp theo.","Mình từng nghĩ cứ làm nhiều, thu nhập cao thì mình sẽ làm được nhiều thứ hơn, sống có ích hơn, nhưng đổi lại chỉ là những chi tiêu xa xỉ và đống nợ tín dụng mà mình nghĩ nếu mình còn tiếp tục thì chẳng bao lâu nữa mình cũng trở thành miếng mồi cho tư bản.","Mình từng nghĩ có tiền, ừ đúng là không có tất cả, nhưng cũng có hầu hết. Nhưng mình không biết rằng sẽ đến lúc mình không còn hứng thú với việc có tiền nữa. Không một chút nào","Ai đó đã nói, đừng định giá sự nghiệp của mình bằng tiền, tiền là công cụ, là phương tiện chứ không phải đích đến.","Đồng tiền ý nghĩa là đồng tiền đúng với giá trị mình tạo ra, và chỉ là đồng tiền hữu ích khi mình hạnh phúc với việc mình đang làm. Nên dù lựa chọn của mình nghĩa là phải đánh đổi tất cả những thứ vật chất mình có thể có trong tương lai, mình vẫn tin rằng sự khoẻ mạnh mới là điều quan trọng nhất, và mình hạnh phúc với sự tự do tự lo hiện tại.","Lâu quá không viết nên ngại tay ghê, giờ muốn viết cũng thấy ớn qué, đọc hong tự nhiên gì hết mà mình cũng khum ra được chữ nào nữa nên là thui tạm bịt mọi người nha. Lúc khác siêng hơn mình sẽ quay lại","Chúc mừng sinh nhật bé Diên 🌸"],"q":"Bằng cách nào đó, mình nhận ra đồng tiền không còn là thước đo cho sự thành công của mình nữa."},{"s":"tan-man-cuoi-thang-6","t":"Tản mạn cuối tháng 6","d":"2023-06-29","c":"marketing","p":["Hi chào mọi người,","Cũng đã một khoảng thời gian rồi mình mới lại update chiếc blog nhỏ này. Thật ra thì, mình đã dự định làm tản mạn từ đầu tháng 5 cơ, nhưng tới tận bây giờ mới thật sự ngồi lại và gọi là, có chút siêng năng để viết.","Hai tháng vừa qua đã đánh dấu những cột mốc mà với mình, là cực kì tuyệt vời trong suốt khoảng thời gian gần đây. Mình nghĩ rằng việc mình lựa chọn lùi lại một bước, cố gắng cải thiện bản thân và học cách yêu chính mình hơn trong nửa đầu năm 2023 này là một sự lựa chọn rất rất rất đúng đắn. Và nhờ đó, mình đã may mắn tìm được cho bản thân một môi trường cực kì đáng mơ ước để làm việc, học hỏi và phát triển. Nhưng mình vẫn trong quá trình thử việc nên là hiuhiu mọi người hãy chúc mình đỗ được 2 tháng này nha, vì mình rất rất rất là thích công ty hiện tại của mình luôn hong muốn rời đâuu","Thời gian gần đây mình cũng gọi là hơi bận rộn một tí, do có việc làm fulltime mà, nhưng mà nhờ vậy mình lại thấy mình như kiểu được sống trở lại í. Thà là bận rộn làm việc có ích cho đời còn hơn là nằm ì cả ngày ở nhà đúng hong? Dù vậy, mình vẫn thấy khá là tiếc vì vẫn chưa thể tối ưu hiệu suất làm việc ấy, như kiểu nếu mình tận dụng được những khoảng thời gian rảnh rỗi sau giờ làm thì chắc hẳn mình sẽ còn có thể học và làm thêm được nhiều điều có ý nghĩa hơn nữa ấy. Phải cố gắng hui","Có một chuyện nhỏ mà mình đã bất ngờ phát hiện vài ngày trước. Mình đã nhìn mọi chuyện một cách tích cực hơn, hơn rất nhiều so với mình của vài tháng về trước. Mình nhận ra mình bớt than vãn đi một tí, bớt càu nhàu đi một tí, và bắt đầu tập trung vào cách giải quyết vấn đề hơn là chỉ chăm chăm vào lỗi sai của bản thân, hay chăm chăm đổ lỗi cho những yếu tố khách quan.","Ví dụ siêu ngộ là sáng hôm đó ra đường mình xém té vì chạy ngang lỗ cống, nhưng xe mình chỉ vừa nghiêng thôi là mình đỡ được rồi nên khom sao hết. Điều làm mình bất ngờ là, nếu thường ngày, đang gấp, mà còn vướng phải cái gì đó làm mình chậm lại, thì dù thế nào đi nữa, mình cũng sẽ nghĩ là xui quá, xong nhăn nhó khó chịu, thế nhưng hôm đó câu đầu tiên mình thốt ra lại là: \"May quá\". Kiểu mình nói xong mình thấy ngạc nhiên ngang luôn í vì mình không nghĩ là mình lại có thể tích cực được đến vậy, và ngay tại lúc đó mình đã thấy biết ơn rất nhiều vì dù có hơi vấp, nhưng mình đã không ngã, phải mà ngã thật thì mới đúng là xui. Thế là cả ngày hôm đó mình cứ nghĩ mãi về điều này.","Mình tin là mình biết lý do. Lý do cho những chuyển biến tốt đẹp trong thời gian gần đây với cuộc sống của mình. Có thể nhiều bạn sẽ không tin, nhưng mình đã viết nhật kí biết ơn đó. Và mình vẫn đang cố duy trì thói quen này (đến hôm nay là được khoảng 12 13 ngày rồi), để cảm thấy yêu đời, yêu mình hơn. Bắt đầu từ những câu chuyện rất nhỏ như \"hôm nay trời đẹp quá\", \"hôm nay được mẹ nấu cơm giở đi làm\", hôm nay sếp khen mail mình viết good, bữa thì được bạn thân cho xiền =)),... tất cả những điều tưởng chừng rất thường nhật đó khiến mình nhận ra là mình may mắn hơn rất rất nhiều người, thấy mình biết trân trọng cuộc sống hơn, thấy mình cũng... muốn sống hơn một ít.","Thế nên là, dù rằng trải qua không nhiều cũng không ít chuyện này kia trên đời, mình vẫn mong rằng bản thân mình có thể ngày càng yêu quý những niềm vui bé nhỏ của việc được sống nhiều hơn, để những tháng năm còn lại ở trên đời, mình thấy mình đáng sống.","Còn mọi người thì sao? Mọi người có câu chuyện gì ngồ ngộ muốn kể hong?","Cũng như việc viết ra đã khiến mình thấy bình yên trong lòng, mình mong rằng bất kì ai đọc được blog của mình cũng sẽ thấy nhẹ nhõm hơn, yêu đời hơn, dù nghe nó siêu việt tầm cỡ đồ quá ha =))","Vậy hoii à~","Cuối cùng cũng viết xong một chiếc tản mạn tháng 6 rồii =))","Goodnight mọi người và nhớ là Smile more, live fulfilly nhaaaa !!"]},{"s":"tan-man-dau-thang-4-2023","t":"Tản mạn đầu tháng 4/2023","d":"2023-04-02","c":"diary","p":["Hi, xin chào mọi người, lại là mình đây~","Cũng đã lâu rồi mình không viết blog trở lại, cũng không cập nhật tình hình gì trên blog cả, để chiếc blog của mình mốc meo cũng đã hơn vài tháng, thật là xấu hổ quá đi. Thế nhưng thật tình là mình chẳng biết phải update với mọi người gì cả... Cuộc sống của mình dạo này nó cứ thế nào í, chắc là khác nhiều so với dự định của mình, với kì vọng của mình và tất nhiên là với tất cả những người xung quanh nữa - từ những người thân thiết nhất cho đến những người chỉ đơn thuần là quen biết mình, tất cả đều không nghĩ rằng mình sẽ làm những điều có chút \"điên rồ\" như vậy, trong khoảng thời gian mà người người nhà nhà đều chọn cho mình những con đường có tiền đồ rực rỡ... Thôi không vòng vo nữa, nói thẳng ra thì, mình đã thất nghiệp rồi. Dù cả hai sếp đều muốn giữ mình lại, thế nhưng đâu đó mình vẫn cảm thấy con đường này, tại thời điểm này, có lẽ chưa phải là con đường đúng đắn nhất dành cho mình, và mình vẫn tin rằng bản thân mình có thể tự bước đi trên một con đường khác một cách tự tin hơn, hãnh diện hơn, tin tưởng vào điều mình làm và thật sự hạnh phúc trong công việc.","Thế là mặc dù nghe rất hề hước, nhưng mình đã lựa chọn cách thất nghiệp để theo đuổi thứ mình thích :D","Lúc ban đầu, mình đã vẽ ra cho bản thân rất nhiều lối đi, những lối đi mà mình tin rằng chỉ cần mình nỗ lực, hết mình có ý chí thì mình sẽ thành công và sự thành công này sẽ là thành công thật sự - nghĩa là mình sẽ thấy hạnh phúc với việc mình làm, chứ không phải chỉ là làm vì tiền nữa (dù có tiền thì đúng là sướng thật). Thế nhưng dần rồi, mình lại cảm thấy bản thân mình lười quá đi, quá sức lười biếng, và lại có xu hướng sa đà vào những thứ giải trí nhất thời hơn là việc mà mình cần làm, phải làm, và phải hoàn thành tốt. Mình lại còn mất tập trung nữa cơ, cứ làm một ít, lại thấy mình cần phải nghỉ ngơi, song cuối cùng lại chẳng làm xong được cái gì.","Đầu tháng tư này, sau khi mua kha khá đồ shopee (dù rằng mình chẳng dùng tới, chẳng phải là đồ \"nhất thiết phải có\" để mua), mình mới nhận ra rằng, có vẻ như, mình đang chẳng thật sự sống cuộc đời mà mình muốn sống. Mình còn chẳng mảy may theo đuổi nó cơ, thế thì làm sao mình có được cuộc sống đó đây nhỉ? Vậy nên trong một phút ngồi thẫn thờ, mình đã quyết định là, mình phải có được cuộc sống đó! Mình phải bắt đầu lại với việc kiên quyết với bản thân, đặt ra những giới hạn, đặc biệt là, không đi chơi bời với bạn bè nữa, cũng như kiểm soát chi tiêu của bản thân mình tốt hơn hic","Mặc dù mình đã gặp phải kha khá vấn đề (đặc biệt là vấn đề tài chính) sau khi lựa chọn đánh đổi giữa mức lương 20+ củ để đổi lấy cuộc sống vô tư không lo nghĩ như hiện tại, thế nhưng mình tin rằng, sự đánh đổi này là xứng đáng, bởi mình đã cảm thấy những thay đổi tích cực hơn đến với bản thân, thấy may mắn khi được ở trong một môi trường mà mọi người đối tốt với nhau hoàn toàn không toan tính như thế giới của người lớn, và thấy mình bắt đầu biết yêu bản thân mình hơn. Mình nghĩ rằng, ai trong đời đều phải đối mặt với những sự lựa chọn, những bước ngoặt mà mình phải đau đầu suy nghĩ, xem hướng nào mới là đúng đắn. Với mình, mình chọn tin tưởng vào cảm giác của bản thân. \"Mình có hạnh phúc với nó không?\", \"mình có thấy tràn đầy năng lượng mỗi sớm thức dậy hay không?\", \"mình có thấy bản thân mình phát triển hơn không, tích cực hơn không?\"... Hàng ngàn câu hỏi được đặt ra, thế nhưng mình nghĩ rằng, từ sâu tận đáy lòng, mọi người đều đã có sẵn cho mình câu trả lời ngay khi câu hỏi được đặt ra rồi, chỉ là mình có nhận ra được điều đó hay không thôi. Thay vì suy tính thiệt hơn đủ điều, tĩnh tâm lại, hít thở đều và cảm nhận sự thay đổi trong cảm xúc của mình, để thấy rằng mọi vấn đề trên đời thật ra đều rất đơn giản. Bởi lẽ mọi sự lựa chọn, nếu không xuất phát từ niềm tin mạnh mẽ của bản thân mình, đều có thể dễ dàng đổ vỡ sau những cơn rung chấn.","Văn vở ha, nhưng cái nết hành văn bất cần của mình nó cứ như vậy á. Có lẽ đây cũng là những điều nhỏ nhặt mình rút ra được sau hơn nửa tiếng ngồi thẫn thờ viết linh tinh, mong rằng có thể giúp được bạn nào đang phải đối mặt với sự lựa chọn có thêm dũng cảm để quyết định cho bản thân mình nha~","Vậy thôi à, chúc mọi người một tuần mới sắp đến thêm nhiều nhiều nhiều năng lượng tích cực để thêm iu đời hơn nho ~"]},{"s":"ux-ui-study-resources-for-beginner-updating","t":"UX/UI Study Resources for Beginner (updating...)","d":"2023-01-13","c":"marketing","p":["UI Rules/Principles","The 4 Golden Rules of UI Design","10 Usability Heuristics for User Interface Design","Principle of Consistency and Standards in User Interface Design","How to Create a Pattern Library and Why You Should Bother","Pattern library and style guide examples on Website Style Guide Resources","A Practical Guide to Creating Your First Pattern Library"]},{"s":"di-lam-bi-chui-im-hay-cai","t":"ĐI LÀM BỊ CHỬI, IM HAY CÃI?","d":"2023-01-07","c":"growth","p":["Repost bài viết mình đã đăng từ Page \"Một chiếc blog của Thảo và Diên\" ngày 07/09/2022","Gắn cái title cho nó giật tít vậy thôi chứ mình đi làm hong có bị chửi nên mình không đảm bảo trả lời được câu này cho các bác :))","Nhưng mình biết chắc một điều là, con người không có ai hoàn hảo hết, và ngay cả mình cũng có nhiều lúc làm sai, nhiều lúc lơ là, và nhiều lúc bỏ bê trách nhiệm công việc của mình (như bây giờ đáng ra đang phải làm việc thì mình lại đi gõ phím vầy nè). Thế nên là, tuy cá nhân mình hong có bị chửi nhiều, thay vào đó là bị nhắc nhở nhiều hơn, thì mình cũng, gọi là có xíu kinh nghiệm trong việc đối mặt với những tình huống như thế này.","Thường thì, chuyện gì xảy ra cũng có 2 (hoặc nhiều) mặt của vấn đề, nên lúc mình bị la, hay bị nhắc nhở, mình đều giữ trong đầu quan điểm là: \"Mình có làm sai thật không và nếu sai thì sai ở đâu?\" - Mình nghĩ là cái này tưởng dễ, nhưng lại không phải quá dễ với tất cả mọi người, đặc biệt là gen Z bây giờ (tại mình cũng là gen Z - mà gen Z thì đã biết ưu tiên cho bản thân hơn công việc nhiều so với những thế hệ trước). Nhận ra mình có lỗi, dù ít dù nhiều trong tình huống như thế này, đối với mình là một lợi thế, vì nó giúp mình đối diện với những lời tiêu cực một cách có chọn lọc hơn, và chỉ lắng nghe những góp ý mang tính xây dựng, thay vì tập trung vào những câu chì chiết. Và bằng cách nào đó thì điều này giúp mình phát triển hơn từng chút một, bằng cách biết nhận sai, và sửa sai, ừ thì, cũng là nhờ cố gắng từng chút một í, để hạn chế bị la hơn, đặc biệt là những cái đã bị la trước đó.","Trong trường hợp không hoàn hảo, khi mình bị la, mà nghĩ tới nghĩ lui vẫn không thấy mình có lỗi, và điều này lặp đi lặp lại nhiều lần, thì nên nghỉ việc =))))","Thật, không hề đùa =))))","Như mình đã nói, gen Z đặc biệt quan tâm đến trạng thái của bản thân, mình có đang ổn không, mình có đang hạnh phúc với công việc không, mình có thấy áp lực hay xì chét đến mức không thể tiếp tục làm nữa, thì thôi nghỉ việc cho vuông","Không phải là mình khuyên mọi người thấy khó quá mà bỏ (thật ra cũng 1/2 là như thế đi), nhưng có những thứ không phải cứ cố là được, cũng không phải lúc nào người ta cũng nhìn thấy được nỗ lực của mình. Nếu phải làm việc trong trạng thái nỗ lực bị chối bỏ như vậy, e là không sớm thì muộn bạn cũng sẽ cảm thấy chán ghét công việc, chán ghét bản thân mình, mà trước hết là chán sếp đã.","Tin mình đi, mình đã từng rơi vào trạng thái không có muốn nghe bất kì một lời nào từ sếp mình, ngay cả nghe một câu chào, hay một câu \"hôm nay thế nào rồi em\" cũng cảm thấy chán ghét, RẤT CHÁN GHÉT. Có thể họ không làm gì sai, chỉ là mình cảm thấy cách làm việc của mình và sếp không phù hợp, và những góp ý từ sếp làm mình nhận về nhiều tiêu cực hơn là thật sự hỗ trợ được cho công việc. Mình vẫn giữ trạng thái là sếp mình vẫn là một người tốt, và tự nhủ là những feedback này chỉ là nhất thời, mình vẫn điều chỉnh cảm xúc được, cho tới ngày mình thật sự hết chịu nổi để đi tới quyết định nghỉ việc - dù công việc đó có thể giúp mình có nền tảng tài chính ổn định hơn nhiều tại thời điểm đó, mình mới nhận ra mình thật sự cảm thấy nhẹ nhõm và giải thoát khỏi môi trường nhiều phần tiêu cực đó. Sau thời gian đó mình vẫn đôi lần thấy mình có cái sai, vì vẫn nên báo trước và không nên hành xử có chút dứt khoát như vậy, nhưng điều khiến mình hối hận chỉ là mình đã không xin nghỉ sớm hơn để tốt cho cả hai bên, chứ không hề hối hận vì đã nghỉ việc.","Mình nghĩ mọi thứ là ở bản thân mình. Mình tin tưởng mình làm được, mình có năng lực và mình đã nỗ lực cho công việc, thì không có lí do gì mình sợ bị feedback hay bị nhắc nhở vì đã làm chưa tốt cả. Có thể sẽ buồn một chút, mệt mỏi một chút ngay tại lúc đó, nhưng nó sẽ giúp mình cẩn thận và làm việc hiệu quả hơn về lâu dài. Quan trọng là mình phải nhận thức được lỗi sai của mình nếu có, và hướng tới giải quyết vấn đề, chứ không phải chăm chăm vào cảm xúc của bản thân, để công việc trở thành một thử thách thú vị và mình thấy mình trưởng thành hơn với nó, thay vì là chầm kẽm mỗi ngày và đổ lỗi cho tất cả mọi yếu tố bên ngoài.","Kết, đi làm bị chửi, đúng thì im, sai thì cãi, không cãi được nữa thì nghỉ việc =)) Mà nghỉ việc nhiều quá thì nên coi lại bản thân mình nha hỏng có bênh ai nhưng mà tất cả mọi sự lựa chọn đều là từ mình thuiii"]},{"s":"2022-recap","t":"2022 Recap","d":"2023-01-04","c":"diary","p":["Hi mọi người, một năm mới nữa đã trôi qua, cột sống mọi người có ổn hong? (Chứ mình thì... không ổn lắm)","Thật ra ban đầu mình cũng khá là hứng thú với việc viết blog, và hơn nữa là viết cho mọi người đọc, nhưng dần rồi thì mình nhận ra không nên chia sẻ quá nhiều chuyện riêng tư, vì cái tính mình hay lan man í, viết một hồi là lại bị sa đà vào việc kể chi tiết xong quên luôn mục tiêu viết ban đầu. Thế là mình lại ngại viết, nếu có thì cũng chỉ viết xong để nháp hoặc đăng private chứ không đăng public nữa. Có lẽ mà vì vậy nên dù đã lập blog được hơn 2 năm, số lượng bài đăng cũng chỉ vỏn vẹn mấy bài đếm chưa đủ 1 bàn tay. Oe oe.","Tiếc í, cũng có chút hối hận nữa, vì đã không viết nhiều hơn, nên mình lại đi lướt vòng xem anh Kira đăng cái gì =)) để mình thấy mình không cô đơn - trong việc viết blog tản mạn về cuộc sống hằng ngày. Vậy nên là ta da, mình đã xuất hiện trở lại rồi đây ~","Nếu phải nói về năm 2022 trong một từ thì mình sẽ tóm gọn lại bằng chữ \"quằn\". Quằn lắm, đến con giun cũng không quằn bằng mình. Mình bắt đầu năm 2022 bằng đêm giao thừa 1.1 khá vui vẻ, xem pháo hoa rồi chụp hình với bạn thân. Nhưng đến lúc cận Tết âm (và khoảng thời gian dài sau đó), quay đi quẩn lại vẫn chỉ có mình mình. Nói chung là tổn thương sâu sắc nên mình đã quyết định nghỉ chơi hết tất cả bạn bè của mình, tuy là sau này mọi chuyện cũng được giải quyết ổn thoả và bọn mình chơi lại với nhau như bình thường, nhưng mà khoảng nửa đầu năm 2022 đã ảm đạm như vậy đó. Mình nghĩ chắc hẳn là mình không thể sống thiếu tụi nó í, nên là dù quyết định chắc nịch ngay tại thời điểm đó, mình vẫn bứt rứt không chịu nổi, kiểu cứ phải nói hết rõ ràng một lần mới nghỉ chơi được chứ không muốn im im bỏ đi. Ai dè chơi lại =))) Chưa biết sắp tới có hối hận hong chứ năm vừa rồi thì mình vẫn cảm thấy không hối tiếc vì dù có nghỉ chơi thật thì ít ra mình cũng đã nói hết những gì cần nói :v (mà cũng chắc vậy nên mới hong nghỉ chơi)","Đó là chuyện của nửa đầu năm. Nửa cuối năm thì mình lại vướng phải những mâu thuẫn khác, của mình và do mình. Nói sơ qua về tình hình công việc của mình thì mình đã làm freelance được khoảng 1 năm, thời gian không dài không ngắn, nhưng dần dần thì một đứa hoạt ngôn như mình lại cảm thấy bí bách vì không được tiếp xúc với con người. Thế là mình tìm kiếm một công việc fulltime, mong mỏi được sống trong xã hội náo nhiệt, nhưng không ngờ công việc fulltime của mình cũng là làm trực tiếp với BOD và giờ thì sếp của mình đã đi du học bỏ lại mình toi trong căn phòng trống :) Bùn lắm :) Có những ngày mình thật sự stressed out đến mức cảm thấy cuộc sống chẳng có ý nghĩa gì. Công việc thì vẫn cứ tồn đọng ở đó, còn mình thì mỗi ngày đi làm đều như cái xác, mà phải cái xác không hồn còn làm xong việc thì đỡ, xác này không có nổi xíu năng lượng nào để gõ phím luôn. Cứ đờ đờ đẫn đẫn đúng giờ là lết xác lên văn phòng, rồi cũng đúng giờ lại lết xác đi về nhà, xong lại stress vì chưa làm được gì, and again.","Mình muốn bỏ việc rồi. Mình nghĩ cứ đà này thì không thể nào phát triển được, chỉ có đi lùi thôi. Thời điểm đó mình đang đảm nhận cùng lúc 2 công việc, và mình đã quyết tâm nghỉ cả hai.","Đơn xin nghỉ đã sẵn sàng.","Và sếp của mình cũng đã đồng ý.","Nhưng đó chỉ là câu chuyện của một tháng trước.","Mình đã chùn bước.","Thay vì nghỉ cả hai, mình chỉ nghỉ 1 job. Job còn lại, sếp mình còn không biết mình định nghĩ việc nữa cơ.","Cũng không biết là do mình hèn, chưa đủ can đảm để tự tay vứt bỏ chén cơm của mình, hay là do mình vẫn cảm thấy chưa đủ - chưa đạt được đỉnh cao mình muốn trong công việc này nên cuối cùng vẫn rút lại tờ đơn. Nghĩ đi nghĩ lại thì, mặc dù lúc đó mình cực kì stress, nhận lương cũng không còn vui vẻ nữa, có khi xin nghỉ thì mình đã nhẹ nhõm hơn rất nhiều, nhưng đâu đó mình vẫn có cảm giác mạnh mẽ rằng mình sẽ phải vượt qua được, rằng mình có khả năng, và sẽ tiến xa được trên con đường này.","\"Mình còn chưa bắt đầu nữa. Mình không thể bỏ cuộc được.\"","Khoảnh khắc quyết định bỏ cuộc khiến mình khó chịu bứt rứt kiểu gì í, kiểu cứ mâu thuẫn không dứt được. Nên mình lại tự nhủ rằng mình sẽ cho mình một cơ hội cuối cùng với công việc này, và mình sẽ phải làm được, mình chỉ nghĩ như thế thôi.","Chậc. Đi làm mà không có đồng nghiệp thì buồn thật sự luôn í, chưa kể đôi lúc mình lại thấy bạn bè checkin chỗ làm đông đúc nè, đi chơi với công ty nè, hay thấy văn phòng mọi người trang trí Noel náo nhiệt thì lại tủi thân muốn xỉu, nhưng đành chịu thôi chứ biết sao được. Mình nghĩ cái số mình năm nay là phải vượt qua cuộc sống một mình rồi - nghĩa là chừng nào mà mình chưa thấy hạnh phúc với việc tự làm chủ mọi thứ, tự sắp xếp công việc, tự lên kế hoạch, tự thực thi và kỷ luật với bản thân thì mình phải làm một mình cho đến khi vượt qua được, và bắt đầu cảm thấy yêu công việc của mình mà không cần có những yếu tố bên ngoài như đồng nghiệp, môi trường,..v..v.... Trời cho cái số freelance nó zị rùi, thì chấp nhận thui chứ sao giờ :v","Đó, là kết thúc năm 2022 của mình. Một năm quằn quại. Đi du lịch 2 lần cũng quằn quại. Toàn là đối mặt với deadline và tự đấu tranh với bản thân lười biếng. Nhưng rồi mình cũng dần dần vượt qua được. Và mình nghĩ rằng thời gian sắp tới rồi cũng sẽ ổn thôi (dù thần số học bảo là năm nay và năm sau là 2 năm \"chạm đáy nỗi đau\" của mình). Con người mà, ai mà hong có lúc gục ngã đâu. Nên là mình cứ cố gắng đi tiếp thôi. Mặc kệ ai nói gì thì nói, miễn là mình cảm thấy nó đúng, nó có khả năng, thì mình sẽ đi tiếp đến cùng. Yeee","Mình nghĩ là năm vừa qua của mình cũng có kha khá chuyện vui, kha khá chuyện để kể í, nhưng mà do cuối năm của mình quằn quá đi, nên là mình khó mà nghĩ đến những chuyện khác. Khi nào có dịp (hoặc có tâm trạng tốt), mình sẽ lại viết một chiếc recap phiên bản tích cực hơn he :)))","Chúc mọi người một năm 2023 thậtttttt là viên mãn, đạt được mọi điều mình mong đợi và tận hưởng năm mới với thật nhiều niềm vui cũng như là ngày càng thành công trong cuộc sống nheee ~","Mình cũng chúc bản thân mình như zậy luôn! Gambatte ne~"]},{"s":"anxiety-au-lo-va-cach-xoa-bo-chung","t":"Anxiety - Âu lo và cách xoá bỏ chúng","d":"2022-11-29","c":"growth","p":["Xin chào mọi người, lại là mình đâyy ~","Cũng lâu rồi mình không đăng gì, thế nên hôm nay mình sẽ viết về \"Anxiety\" và cách xoá bỏ âu lo nhé","Vì sao á? Vì mình âu lo, và mình đoán rằng ai trong chúng ta chắc chắn cũng trải qua tình trạng này không nhiều thì ít, và mỗi lần như thế, chúng ta lại muốn vượt qua nó, tại vì ai đâu mà muốn âu lo hoài ~","Vậy rồi làm thế nào để \"tạm gác hết những âu lo này\"?","Mình sẽ chỉ mọi người 1 tips cực kì đơn giản mà mình cảm thấy rất hiệu quả với mình.","Đó chính là: Đi uống nước.","Siêu dễ luôn đúng hong? Tại sao là uống nước thì mình cũng không rõ (nếu phải giải thích theo kiểu khoa học thần kinh nơ ron hoocmon ơ đồ), nhưng mình biết là khi tâm trạng của mình bất ổn, việc uống một ngụm nước sẽ giúp mình tập trung vào ly nước, \"ngụm nước\" mình uống, và từ từ từng chút để cơn âu lo trôi theo dòng nước - với mình là như vậy. Mình cảm thấy mỗi khi uống nước chậm rãi, mình có cơ hội để thở - điều mà nhiều bạn sẽ cảm thấy khó khăn khi âu lo, và vì có cơ hội để thở, để oxy lên não, mình sẽ bình tĩnh hơn, rõ ràng hơn một chút với những suy nghĩ của mình.","Nếu mà các bạn đã uống nước nhưng vẫn không bớt âu lo, hãy đi tắm nha. Đó cũng là một giải pháp cực kì hiệu quả với mình, đặc biệt là khi mình có quá nhiều thứ để nghĩ, quá nhiều vấn đề cần giải quyết. Nhưng đi tắm không có nghĩa là cứ tắm nhanh nhanh để mong hết lo âu, mà cần phải tập trung vào làn nước, thế nào nhỉ? \"Tập trung tắm\" hả :v","Ý mình là, thay vì nghĩ đến mục đích, thì cứ tận hưởng quá trình gột rửa đó thôi, suy cho cùng thì tắm cũng là một cách thư giãn, thả lỏng mà. Và đó, có thể, cũng là lí do khiến cho mình dễ thở hơn một chút, và tương tự, suy nghĩ logic và hiệu quả hơn.","Mình đã, cũng có một chút, vượt qua những lúc khó khăn như thế, nên mình mong bài này có thể hữu ích với mọi người, cho những người đã và đang cảm thấy lo âu như mình.","Vậy còn bạn, bạn đã vượt qua âu lo bằng cách nào? Cmt cho mình biết nhó!"]},{"s":"binh-thuong-khong-binh-thuong","t":"Bình thường? Không bình thường?","d":"2022-08-19","c":"diary","p":["Hi, mình đã quay trở lại rồi đây. Lí do mình ở đây hôm nay chắc là cũng khá random, đại loại là một chút công việc, một chút cuộc sống, mọi thứ va vào nhau và mình đang dần tiếp xúc với nhiều người nhất từ trước đến nay nên cũng có hơi bỡ ngỡ - cái kiểu tiếp xúc gắn kết thật nhiều thật nhiều để hiểu về người ta hơn là chỉ đơn thuần biết mặt và biết tên. Nhưng tóm lại chỉ có một chữ, vui.","Vui. Và nhận ra là, mình đang làm đúng những gì mình mong ước. Có thể là do mình thật sự cảm thấy bản thân mình may mắn, nên những điều mình mong đợi, dù nhiều hơn một chút, hay ít hơn một chút, đều dần dần dần dần sẽ đến với mình.","Ừ thì,.. đã lỡ mong đợi rồi thì mình cũng xin nhắc lại là mình vẫn đang tuyển người yêu nhé mọi người :)) Tuyển thì tuyển vậy thui, chứ bãi gửi xe còn chưa có, lấy gì có ai đậu qua vòng nào :<","Nhưng đại khái là mình đã dần tìm thấy được hứng thú, rất rất rất nhiều hứng thú trong công việc, được tiếp xúc, được làm những thứ mình cực kì yêu thích, lại được, một cách nào đó, giúp đỡ cho cộng đồng, khiến mình cảm thấy bản thân mình thật sự không còn quá vô dụng như lúc trước nữa. Mình biết, nhiều lúc mình không làm được những điều mình nói (rất nhiều lúc nữa là đằng khác), thế nhưng những kế hoạch mình chưa thực hiện được, mình mong sẽ có người thay mình hoàn thành những điều ấy, và nhiệm vụ của mình, là tìm tòi, là đưa lối cho các bạn, chạm đến những điều lớn lao hơn, cho cả bản thân và cho cả cộng đồng.","Rất rất rất yêu mọi người và cảm ơn cuộc sống đã cho mình những điều tuyệt vời như thế. Thật lòng í :))) Dù rằng bây giờ là khoảng 12h đêm, mình vẫn chưa tắm, chưa làm xong việc gì và biết rằng còn đống việc tồn đọng vẫn đang đợi mình thì, mình vẫn cảm thấy mãn nguyện một ngày bận rộn như thế này. Có lẽ là, thành quả, sẽ đến, khi mà tụi mình biết trân trọng cuộc sống nhiều hơn. Vì có những người, dù rằng khó khăn từ khi lọt lòng, nhưng vẫn tận hưởng từng giây phút, và chọn cho mình nụ cười qua những ngày khó khăn.","Chắc là mình sẽ kể cho mọi người nghe một mẩu chuyện nhỏ của ngày hôm nay nhỉ?","Tụi mình đến lớp học võ dành cho các trẻ bị bệnh Down. Bệnh down, có lẽ một vài bạn sẽ biết, cản trở người bệnh rất nhiều trong việc sinh hoạt, ăn uống, tắm rửa và với những người bệnh nặng, thật khó để các bạn sống cuộc sống của \"một người bình thường\". Tụi mình đến với tâm lý là giúp đỡ, nhưng như mình thấy, không có tụi mình, các bạn vẫn có thể tự làm được việc của mình, dù rằng những bước đi chắc sẽ phải mỏi mệt hơn, những động tác phải tập đi tập lại nhiều lần hơn, và để đánh được một đòn đánh \"bình thường\" cũng sẽ phải vất vả hơn, nhưng không có tụi mình, các bạn vẫn sẽ làm được. Tụi mình tập cùng, chơi cùng và học cùng các bạn, tuy không giúp đỡ được gì quá nhiều, nhưng sẽ là động lực để các bạn tập năng nổ hơn, tự tin hơn, và vui hơn. Nghe kì ha? Ai đời mà việc tập cùng một người bình thường lại khiến các bạn bệnh Down tự tin hơn! Nhưng thật sự là thế í, vì không có điều gì tuyệt vời hơn với các bạn là được nhìn nhận như một người bình thường, được đối xử như một người bình thường, và được giúp đỡ, như một người bình thường.","Cái bình thường, với người bình thường, chẳng có gì là đặc biệt. Nhưng với các bạn, để được \"bình thường\" là một nỗ lực vô cùng to lớn. Và với mình, không có ai là \"không bình thường\" cả, chỉ là mỗi người chúng ta \"bình thường\" theo những cách riêng, và \"bất bình thường\" cũng theo những cách rất riêng, dù có khác biệt như thế nào về dáng hình, giọng nói hay tính cách.","Và mọi người biết hong, mình đã thấy một bạn cực kì giỏi, rất giỏi, thậm chí là so với những bạn cùng trang lứa. Đó là một bạn bé mắc bệnh Down, nói tiếng anh cực tốt, trong lớp tập toàn cười suốt, và khiến cả đám tụi mình, ngay cả cô giáo, phải bất ngờ vì bạn phát âm chuẩn như người Anh. Phải đó! Là giọng Anh chứ không phải giọng Mỹ nữa í, thêm nữa là phản xạ của em cực kì nhanh, mới lớp 6 thôi mà tụi mình hỏi em cái gì, là em đều có thể trả lời được hầu hết 80 90%. Điển hình là một đoạn, tụi mình hỏi em ngủ mấy giờ, em trả lời là 10h, xong lại hỏi ngay các anh chị ngủ mấy giờ, có bạn trả lời 7h sáng, mình cũng vặn lại thế bạn đấy thức dậy lúc mấy giờ, bạn bảo 7h30, em nói ngay \"No. It's not a sleep. It's only 30 minutes. It's a nap\", xong lại còn cãi qua cãi lại với bạn ngủ lúc 7h sáng là đấy là chợp mắt chứ chẳng phải ngủ bằng tiếng anh được một lúc cơ =)) Dễ cưng cực =))","Thích ghê í, tự dưng lại thấy tự hào, vì mình đã vô tình, làm được một chuyện, cũng...chắc là chuyện tốt ha :>","Thế thôi mọi người ngủ ngonn"]},{"s":"nhat-ky-thang-1-trai","t":"Nhật ký tháng 1: Trải","d":"2022-02-03","c":"diary","p":["(Bài viết được viết lần đầu tiên vào ngày 17/01)","Chỉ vỏn vẹn 10 ngày hơn nữa là đến Tết. Năm mới, hẳn ai cũng có trong mình những dự định mới, những mục tiêu mới, và háo hức mong chờ những điều tốt đẹp cho năm mới của mình. Riêng mình lại vật lộn với mớ cảm xúc hỗn độn cùng cơ thể mềm yếu sau biến cố mà mình tưởng sẽ chẳng bao giờ đến với mình, ít nhất là vào thời điểm này.","Mình mất đi một người bạn.","Cảm giác bất ngờ hoảng hốt và bối rối ập đến vào lúc mình nghe tin rằng tụi mình sẽ không còn có thể gặp lại, kéo theo nỗi căm phẫn khi lý do nó mất là \"sốc sau tiêm vắc xin mũi 3\". Người ta tiêm vắc xin để mong khoẻ mạnh vượt khỏi dịch bệnh, còn bạn mình, lại vì thế mà ra đi.","Thế rồi, mình ôm lấy những mất mát đó cạnh bên những ngày cuối năm. Mình cứ chập chờn trong cơn mơ ngủ, lúc mở mắt lại chỉ mong thiếp đi để không phải cảm thấy bất cứ điều gì. Mình đã, cố gắng vượt qua dần dần như thế.","Hôm nay đã là một tuần hơn kể từ ngày đó. Mặc dù không còn đau khổ đến mức mất ăn mất ngủ như trước, mình vẫn còn lặn ngụp trong không khí u buồn như một người vừa trải qua chuyện tang gia. Dù vậy, mình đã ổn hơn trước rất nhiều, để có thể tạm gác lại cảm xúc mà tập trung vào chuyện tương lai.","Nhìn lại năm cũ, bỗng nhiên mình cảm thấy mình đã dần trưởng thành hơn, không hẳn là \"rất nhiều\", nhưng chắc chắn là hơn một chút. Mình cũng đâu đó, đạt được những mục tiêu nhỏ cho bản thân, dù vẫn còn dang dở nhiều thứ, nhưng cũng không phải đã mãi lười biếng suốt năm qua. Năm mới, mình mong là mình sẽ tiếp tục được những dự định còn dang dở, hoàn thành những mục tiêu mình mong ước, tiếp tục viết tiếp những kế hoạch, và từng bước từng bước hoàn thiện bản thân mỗi ngày.","Thời điểm này năm ngoái, mình vẫn còn chạy đi chạy lại ở văn phòng đoàn, chuẩn bị trang trí Tết, rồi đem ý tưởng đó về nhà làm chậu hoa đào. Tuy rằng gốc đào ở cả văn phòng và ở nhà đều không đứng được lâu do thân giả không chịu được lực, nhưng kể ra đó cũng là những trải nghiệm thú vị khó có được. Mọi khi vào dịp này, mình đã cùng bạn bè mở sòng, hay ríu rít rủ nhau xem đồ Tết, chọn cho nhau những bộ váy mới, hay đi làm tóc, và chầm chậm tận hưởng những ngày cận Tết đang về. Hôm nay, mình vẫn còn làm việc và chờ lương Tết, bận rộn với kì thực tập tốt nghiệp, và loay hoay trong hàng đống chuyện không tên khi vẫn chưa thể sắp xếp được thời gian cho bản thân. Nhưng nhìn lại, sau 1 năm, mình đã có một công việc tạm gọi là ổn định, thêm một công việc để kiếm thêm, và nhờ đó củng cố được 1 phần tài chính của mình.","Đâu đó, mình cảm thấy có chút thành tựu nhỏ.","Cách đây chỉ khoảng nửa năm thôi, bạn bè và nhiều anh chị trong ngoài ngành của mình vẫn còn đang khuyên mình tại sao phải gắng gượng như thế khi mình có thể làm được những công việc kiếm được nhiều hơn. Bản thân mình thời điểm đó cũng áp lực vì không thể sắp xếp hiệu quả mọi thứ và để cho mình được nghỉ ngơi. Tuy rằng nếu so với trước đây, mình lại cảm thấy mình còn nhiều yếu kém, khoẻ hơn, lương cao hơn nhưng lại có vẻ lười biếng và sống kiểu hưởng thụ hơn, nhưng ít ra mình đã chớp được cơ hội để bận rộn trở lại.","Chỉ là đôi lúc, mình lại cảm thấy trống rỗng. Có cái gì đó khiến mỗi ngày của mình dường như trở nên dài hơn, yên ắng hơn, nhưng vô vị.","Uhm, chỉ vậy thôi."]},{"s":"nhat-ky-thang-10-cang-ton-thuong-cang-hanh-phuc","t":"Nhật ký tháng 10: Càng tổn thương, càng hạnh phúc?","d":"2021-10-11","c":"diary","p":["Câu chuyện tổn thương, hẳn là ai cũng từng trải qua một lần trong đời. Không có nỗi đau nào là giống nỗi đau nào, nhưng mọi thứ đều bắt nguồn từ cảm xúc.","Mình nhớ có một câu nói rằng: \"Chúng ta không thể kiểm soát được mọi thứ, nhưng ít nhất chúng ta có thể lựa chọn cách phản ứng với nó\". Thế nên dù không thể kiểm soát được cảm xúc, chúng ta vẫn có thể, thường xuyên, nhẫn nhịn và chịu đựng, đến khi tổn thương được chữa lành, mà không làm tổn thương thêm ai khác.","Nói thì dễ, nhưng không phải tổn thương nào cũng có thể được chữa lành. Có những vết xước sẽ mờ dần theo thời gian, nhưng cũng có những vết sẹo sẽ mãi mãi nằm lại trên cơ thể chắp vá của chúng ta, nhiều lúc, vào những khi trời mưa se lạnh, hay vào những lúc gió buốt, nó lại âm ỉ, nhức nhối, gợi nhắc người bị thương về những chuyện đau lòng trong quá khứ.","Dẫu vậy, nếu được chọn, có lẽ mọi người trên thế gian này đều sẽ chọn được tổn thương, vì có \"thương\", nên mới có \"tổn thương\".","Mình, là một người lạnh lùng và ích kỷ, đó là sự thật. Mình hay nghĩ rằng mỗi người chỉ cần làm tốt chuyện của mình là đủ, nên mình thường không trân trọng sự quan tâm từ người khác. Người ta thường chỉ nhớ được những chuyện người khác làm sai chứ ít nghĩ đến những điều tốt đẹp họ đã làm. Có lẽ, mình cũng là một người tàn nhẫn như vậy.","Mẹ mình rất hay \"ngứa mắt\", mình nghĩ phụ huynh nào cũng thế. Họ muốn con mình tự lập hơn, siêng năng hơn, muốn con mình giỏi trong mọi mặt, hoặc ít ra là nhiều mặt nhất có thể, nên thường dùng cách la mắng như một động lực thúc đẩy.","Nhưng điều đó có thể không đúng với mình. Mỗi người đều có 1 2 điểm \"chưa tốt\", với mình, đó là sự lộn xộn, lộn xộn như cuộc đời của mình vậy. Ở nhà, mình thường xuyên để đồ đạc theo kiểu tiện tay. Tiện tay có cái bàn thì để lên bàn, tiện tay có kệ thì để lên kệ, chứ không nhất thiết là đồ A phải để ở vị trí A, hay đồ B phải để ở vị trí B. Phụ huynh hay gọi là vứt đồ lung tung, dù mình để ở đâu thì mình vẫn nhớ, chỉ là nó không được gọn gàng trong mắt mẹ thôi.","Mẹ mình thì không thích thế, nên mẹ hay rầy mình lắm. Đôi lúc điều đó làm mình cảm thấy mệt mỏi, vì mình vốn bướng bỉnh, thích bắt bẻ, và mẹ thì vẫn hay nói quá, kiểu \"con đúng là đồ bất hiếu\", chỉ vì mình nhiều lần để quần áo không đúng chỗ, dù có lẽ mình biết mẹ không có ý nặng lời. Những lúc như vậy, mình vẫn thường trách mẹ. Mình bảo là, mẹ cứ mặc kệ con, hay, mẹ cứ để đấy lát con dọn,... mình bảo là, vì mẹ quan tâm quá, nên mẹ mới bực dọc, mới khó chịu, chứ như mình nè, dù mẹ có bừa bộn, có quên mất chuyện mình nói, mình cũng không để tâm quá nhiều.","Ý mình là, thấy lần nào thì mẹ cứ nhắc lần đó thôi, dần rồi mình cũng nhớ, chứ không phải để bụng, rồi gộp từng chuyện từng chuyện lại với nhau, suy diễn đủ thứ, rồi cứ mỗi lần thấy mình bừa bộn, mẹ lại gôm hết những lần trước đó để trách mình.","Thế là mẹ bảo, vì con là con của mẹ, nên mẹ mới để tâm, mới phiền lòng, mới lo lắng, mới rầy la.","Được thương yêu, là một phúc phần, có lúc, cũng vô tình trở thành gánh nặng.","Cán cân tình cảm, cho - nhận, vốn chưa hề công bằng. Người ta thường nói, ai cho đi nhiều hơn, sẽ thiệt thòi hơn. Nhưng mình lại không nghĩ thế. Thường thì trong chuyện tình cảm, mình ít khi suy nghĩ thiệt hơn, mình cho đi, đơn giản chỉ là vì mình muốn thế, và mình mong rằng người nhận sẽ vui vì điều đó, hơn là cảm thấy áp lực, hay mệt mỏi. Nếu nói rằng mình không hi vọng được đáp lại có lẽ sẽ là nói dối, nhưng nếu biết sẽ không được đáp lại từ đầu, mình sẽ không dốc lòng với họ, có thể là vì mình hèn, và vì mình muốn họ cảm thấy thoải mái hơn là cứ né tránh mình.","Nhưng mình sẽ không buồn.","Vì mình không hi vọng quá nhiều, không đòi hỏi đáp lại, nên dù mọi chuyện ra sao, mình vẫn cảm thấy bình thường. Và đối với bạn bè mình cũng thế. Có thể cùng nhau vui vẻ là một chuyện tốt, nhưng nếu một lúc nào đó không thể cùng trò chuyện với nhau, mình cũng thanh thản buông tay. Chỉ cần thật lòng với nhau là đủ, dù là cho - nhận, hay là từ chối.","Mình biết, mình như thế này, có khi lại không tốt. Có khi chính vì mình nghĩ như thế, nên mình vô tình áp đặt rằng người khác cũng nên nghĩ như thế. Có thể trong lúc nào đó, vô tình mình đã nghĩ rằng việc cho đi, và đòi hỏi đáp lại, là một điều \"không tốt\". Có lẽ là vậy, nên nếu mình lỡ như cảm thấy sự yêu cầu đáp lại từ người cho, mình lại không còn thoải mái được nữa, vì vốn dĩ mình chưa từng đòi hỏi được nhận. Thế nên thà là mọi người mặc kệ mình, còn hơn là mọi người cứ quan tâm mình, rồi khổ vì mình, rồi lại trách mình.","Vẫn là mình ích kỷ. Mình vẫn muốn đáp lại tất cả mọi người, nếu có thể. Nhưng nếu không, thì thà rằng mọi người cứ ghét mình vẫn hơn. Dần dà, mình trở thành một người vô tâm, mình không buồn, nhưng mình cũng không vui. Mọi thứ cứ lưng chừng giữa việc giữ cho bản thân ổn định, tích cực, hạnh phúc với những điều mình có, và cố gắng tốt hơn mỗi ngày, với việc dằn vặt, trống rỗng khi tự hỏi mình lý do để tồn tại.","“Làm sao có thể sống mà không yêu?”","Có lẽ, mình chưa từng thật sự chấp nhận tổn thương như mình vẫn nghĩ. Có lẽ việc mình làm chỉ là né tránh mọi sự đau khổ có thể xảy ra, và vờ như một mình mình vẫn ổn, dù thế nào đi nữa. Không phải vì thật lòng chấp nhận, mà vì mình sợ mình sẽ để tâm, sẽ lo lắng, sẽ đau khổ, nên mình dừng bước trước vạch an toàn, và ép bản thân mình chấp nhận.","Nhưng mình liệu đã hiểu hết về “thế nào đi nữa” hay chưa?","Chúng ta tổn thương, vì chúng ta có “thương”, đó là phúc phần, cũng có lúc là gánh nặng. Nhưng dù là bị tổn thương gấp trăm lần, có lẽ, chỉ một lần đáp lại cũng đã khiến hạnh phúc lớn hơn gấp bội. Càng tổn thương, thì càng hạnh phúc.","Còn mình? Đâu đó, mình vẫn muốn có thể cho đi hết mình như trước. Đâu đó, mình vẫn muốn bản thân có thể dốc lòng, thành thật làm điều mình muốn, hơn là sợ hãi, nản lòng, viện cớ rằng mọi thứ đã được sắp đặt, rằng dù cố gắng, cũng không thay đổi được gì. Đâu đó, mình vẫn muốn trở lại làm mình của tuổi 15, 18. Tự tin, ngông cuồng, và dũng cảm, kể cả có tổn thương, vẫn có thể bước tiếp, và sống thật với lòng mình. Chỉ vậy là đủ."]},{"s":"personalized-marketing-la-gi","t":"Personalized Marketing là gì?","d":"2021-09-11","c":"marketing","p":["Chắc hẳn là bất cứ ai có tìm hiểu về Marketing đều đã từng nghe qua thuật ngữ này rồi đúng hong. Để tìm hiểu được Personalized Marketing là gì thì chỉ cần vài ba dòng search google là ra, nhưng để hiểu được bản chất và vận dụng sự sáng tạo của mình để phát triển được các chiến dịch Marketing cá nhân hoá thì không hề dễ xíu nào đâu à nhen. Cá nhân hoá có nhiều cách, và bài viết mà mình đang viết này, hướng tới các bạn sinh viên Marketing, cũng là một cách để cá nhân hoá. Vậy thì cá nhân hoá là gì và tại sao mình lại cần cá nhân hoá?","Bài này mình viết cho 1 Page mình đang phát triển nên sẵn update ở blog luôn :> Vì là overview và viết cho các bạn sinh viên Marketing là chính nên sẽ không quá đào sâu vào thuật ngữ mà chỉ giải thích những điều basic thui, mọi người đọc vui nha.","Personalized Marketing là gì?","Cá nhân hoá (tên tiếng Anh là Personalization) là những điều chỉnh trong hoạt động kinh doanh của doanh nghiệp nhằm cải thiện trải nghiệm khách hàng thông qua việc hiểu khách hàng hơn dựa vào phân tích dữ liệu mà người dùng đã để lại thông tin trên các kênh online và offline, tạo ra các chiến dịch Marketing phù hợp với từng cá nhân, từng nhóm khách hàng khác nhau.","Nói nôm na thì cá nhân hoá là việc doanh nghiệp thực hiện các điều chỉnh phù hợp với sở thích và nhu cầu của từng đối tượng khác nhau. Ví dụ: Bạn đến một quán phở thường ăn, cô chủ biết bạn không thích ăn hành nên chủ động không bỏ hành vào bát mà không cần bạn yêu cầu, đó chính là cá nhân hoá.","Vậy bí mật đằng sau cá nhân hóa là gì?","Theo báo cáo từ Econsultancy’s 2017 “Conversion Rate Optimization”, 93% doanh nghiệp nhận thấy rằng cá nhân hoá đã giúp họ đạt được những thành công đáng kể trong việc biến khách hàng tiềm năng thành khách hàng thật sự của mình. Điều gì đã khiến cá nhân hoá hiệu quả như thế?","Dale Carnegie đã từng viết trong quyển sách How to Win Friends and Influence People nổi tiếng của ông rằng:","“Remember that a person’s name is, to that person, the sweetest and most important sound in any language\".","Cái tên rất quan trọng, bằng cách gọi tên của một người khi phù hợp, chúng ta có thể ảnh hưởng tốt hơn đến họ. Dễ thấy nhất là khi bạn ở trong một lớp học ồn ào và đông đúc, dù cho bạn có thể không thể nghe thấy người ngồi cạnh nói gì, nhưng chỉ cần nghe giáo viên gọi đến tên mình, bạn nhất định sẽ chú ý.","Cá nhân hoá cũng dựa trên lý thuyết tương tự. Khách hàng thích được cảm thấy \"độc nhất\". Họ sẽ thích thú nếu một doanh nghiệp biết đến, nhớ đến và muốn mang lại cho họ những trải nghiệm tốt.","Con người được lập trình để cảm thấy vui và hạnh phúc khi được nhận ra và thấy mình có giá trị với người khác, điều đó khiến họ an toàn và tin tưởng đối phương. Vì vậy, doanh nghiệp nắm bắt được điều này sẽ có thể tối ưu các chiến dịch Marketing của mình để mang lại trải nghiệm khách hàng tốt hơn.","Lợi ích của cá nhân hoá?","Rõ ràng, như ví dụ trên, việc cô chủ biết bạn ghét hành và chủ động loại bỏ hành giúp bạn cảm thấy thoải mái hơn nhiều so với việc mỗi lần đến quán đều phải dặn đi dặn lại \"Cô ơi đừng bỏ hành giúp con\" đúng không? Đó chính là tác dụng của cá nhân hoá - mang lại trải nghiệm tốt hơn cho người dùng.","Nhìn chung, lợi ích của cá nhân hoá thường xoay quanh 3 vấn đề sau:","Cải thiện trải nghiệm khách hàng.","Tăng doanh thu.","Xây dựng mối quan hệ khách hàng.","Có thể thấy, giữa hàng loạt các thông tin quảng cáo tràn lan trên thị trường, một thông điệp được cá nhân hoá, đánh đúng nhu cầu của chúng ta sẽ trở nên nổi bật, mang lại cảm giác hài lòng hơn. Sẽ thật bực mình nếu mình chỉ muốn mua một chậu cây để bàn nhưng lại được đề xuất mua hạt giống cây mai hay đào đúng hong? Cũng như theo thống kê, những doanh nghiệp đã áp dụng chiến lược cá nhân hóa đạt doanh số trung bình cao hơn so với các doanh nghiệp không áp dụng tới 19%.","Ngày nay, các chiến dịch cá nhân hoá không chỉ giúp người dùng có một trải nghiệm tốt hơn mà còn hướng đến việc tạo ra cảm xúc tích cực cho khách hàng. Và chính những cảm giác tuyệt vời đó sẽ là cây cầu vững chắc kết nối thương hiệu với khách hàng của mình, mang lại lợi nhuận to lớn cho doanh nghiệp. Điển hình có thể kể đến chiến dịch khắc tên của Coca Cola.","Chiến dịch khắc tên của Coca Cola.","Nhắc đến chiến dịch này thì có lẽ các bạn 9x, 2k khó có thể quên được đúng không? Mình còn nhớ hồi đó để săn được một chai Coca Cola có tên mình không hề dễ dàng. Thế nên cứ ngậm ngùi nhìn bạn bè mình tag nhau trên newfeeds với mấy chai Coca thôii.","Giờ hãy cùng nhìn lại chiến dịch độc đáo này một chút nha.","Tại Việt Nam, chiến dịch “Share a coke” có tên “Trao Coca-Cola, kết nối bạn bè” bắt đầu từ ngày 09/06/2014 với những chai Coca-Cola in tên người dùng đã trở thành cơn sốt và trở thành hiện tượng được chia sẻ nhiều nhất trên mạng xã hội. Coca-Cola Việt Nam đã lựa chọn rất nhiều tên riêng phổ biến để in trên nhãn sản phẩm như Nam, Thảo, Quỳnh, Hiền, Yến cho đến Linh, Tùng, Tuấn, Đức, Hà...., hay thậm chí là cách gọi như ông yêu, bà yêu, bố yêu, em yêu hay út cưng để nhắc mọi người về tất cả các mối quan hệ, từ gia đình, bạn online, bạn ấu thơ, đồng nghiệp, người yêu.","Như mình đã đề cập ở trên, cái tên là một trong những ngôn ngữ quan trọng có thể kết nối con người ngay lập tức. Coca Cola đã biết tận dụng điều đó để tạo ra chiến dịch ý nghĩa giúp mọi người kết nối với nhau và mang lại cho Coca Cola thành công vượt trội với:","Hơn 200.000 lượt like Fanpage","Hơn 40.000 cuộc nói chuyện chủ đề in tên lên lon Coke","Từ khoá “Trao Coca-Cola kết nối bạn bè” cho 54.400 kết quả trên Google, tìm từ khoá “Share a Coke Vietnam” có 548.000 kết quả.","Ngoài CocaCola ra thì còn có rất nhiều brand phát triển các chiến dịch cá nhân hoá cực kì sáng tạo và ý nghĩa khác. Ngày nay, cá nhân hoá đã trở thành một phần tất yếu trong chiến lược phát triển kinh doanh của hầu hết mọi doanh nghiệp. Khách hàng tụi mình rất thông minh và ngày càng khó tính đúng không nào? Thế nên để có thể \"lấy lòng\" được tụi mình, doanh nghiệp nào cũng phải nỗ lực rất nhiều.","Thực tế thì giờ tụi mình có thể thấy các hoạt động cá nhân hoá ở khắp nơi, từ cá nhân hoá các email nè, hay những ưu đãi \"chỉ dành cho riêng bạn nè\", đến những chương trình thẻ tích điểm, đề xuất sản phẩm, đều là các hoạt động cá nhân hoá đó. Tên của bạn được các thương hiệu gọi thường xuyên hơn, và bạn cũng dần làm quen với điều đó. Và điều này yêu cầu mọi doanh nghiệp phải ngày càng sáng tạo hơn để tạo ra các chiến dịch cá nhân hoá độc nhất của riêng mình.","Mong là với bài viết này thì mọi người cũng gain được một số insights hữu ích về cá nhân hoá. Mọi người thấy bài viết này thế nào? Nếu có thắc mắc, đề xuất hay bất kì điều gì cần trao đổi thì comment bên dưới cho mình nha.","Hẹn gặp lại mọi người trong các bài viết tiếp theo <3"]},{"s":"mot-chut-nhat-ki-mua-dich","t":"Một chút nhật kí mùa dịch","d":"2021-08-30","c":"diary","p":["Thường thì giờ này mình lẽ ra phải đang làm việc í, nhưng mình lại nghĩ đến điều này, sau khi vòng quanh mạng xã hội một chút. Có vẻ như là mình đang trốn việc một tẹo, nhưng mình nghĩ ý tưởng sẽ trôi đi nếu mình không nhanh chóng ghi chép lại, và có khi sẽ mãi chìm vào quên lãng nếu mình không làm ngay, nên mặc dù có hơi sai một chút, mình vẫn quyết định sẽ dành 5p để tốc kí mùa dịch.","Mùa dịch thì, chẳng có gì để làm, nhưng lại có đủ thứ chuyện để làm. Trước khi mình bắt đầu bước chân vào học kì hè, một ngày của mình trôi cũng khá nhàn hạ. Mình dậy sớm nè, làm chút việc nhà, ngồi vào bàn làm việc, làm đúng giờ hành chính, đôi khi công việc cũng không nhiều nên mình vẫn thường dùng thời gian rảnh xem vài tập phim. Hết ngày thì lại bắt đầu lôi việc còn dang dở ra để giải quyết, vì trong ngày mải chơi í hic. Nhìn chung, cũng khá là nhàn rỗi, đôi lúc còn có thời gian đánh đàn hay karaoke.","Nhưng mà học kì hè đến, mình như kiểu bị đập deadline vào mặt. Thêm cả, một đứa khá là chủ quan và trì hoãn như mình không biết làm thế nào để xoay sở và cân bằng giữa việc học, làm và nghỉ ngơi, giải trí ấy. Nên mình cứ rơi vào trạng thái trộn lẫn mọi thứ vào nhau và mất tập trung cực kì. Thế nên dạo gần đây đôi lúc mình cảm thấy khá stress í, đôi lúc chẳng biết thời gian nghỉ của mình ở đâu trong ngày nữa cơ. 8h30-17h30 thì thực tập, sau 18h lại bắt đầu xử lí đống bài tập 3 môn thay thế tốt nghiệp ở trường, rồi còn cả dự án nghiên cứu khoa học của bọn mình nữa, tuy mỗi thứ chỉ một ít thôi, nhưng mình cũng khá overload. Nhiều việc trong ngày nên mình cứ hay bị đùn đẩy mọi thứ đến deadline í, làm thì cũng làm đấy, nhưng làm mỗi thứ một ít, vừa làm vừa chơi, nên phải gần đến deadline mình mới thật sự tập trung được. Vậy đó, nên tối nào cũng thức đến 12h hơn, xong buổi sáng không còn dậy sớm nổi nữa.","Thế là mình nhớ đến khoảng thời gian trước dịch. Bận bịu. Nhưng bận bịu rất vui. Giờ nghĩ lại khoảng thời gian đó, dù bận, mình vẫn cảm thấy mình là mình nhất. Chưa có giai đoạn nào mình thấy mình bận như cách đây 5,6 tháng. Thời điểm đó, để chuẩn bị đủ tiền cho chuyến đi tình nguyện quốc tế, mình quyết định cày 2 job part-time, có những ngày mình đi làm tận 13 tiếng, ở trường thì học 4,5 môn, rồi lại còn chạy project cho cuộc thi CMO. Bận, bận xỉu, nhưng không có ngày nào là mình không cười. Giờ nghĩ đến mình vẫn thấy hạnh phúc í. Làm cũng nhiều, nghe chửi cũng nhiều, cũng stress, cũng khóc, nhưng mình vui lắm.","Mình còn nhớ những ngày mình túc trực ở chỗ làm gần như 18 tiếng. Vừa mới ra ca thì thay quần áo ở lại lôi laptop ra xử lí công việc, vì sợ về nhà sẽ lười biếng, sẽ muốn nghỉ ngơi. Rồi có những ngày vừa kết thúc công việc ở chỗ làm kia, lại vội về nhà tắm rửa rồi chạy ra quán cà phê làm việc, chạy task với bạn bè, vừa làm vừa uống vừa ăn vừa nói, ở lì đến lúc người ta đóng cửa mới về. Đó là khoảng thời gian áp lực nhất, nhưng mình yêu điều đó. Lắm lúc không hiểu mình lấy đâu ra động lực để quay cuồng như vậy, học rồi làm rồi học, than thở cũng nhiều, nhưng chỉ cần một ly Chocolate đá xay, một ly bạc xỉu, hay một tô mì gà quay 8h tối cũng đủ để làm tụi mình no cái bụng và thấy an ủi. Stress đó, nhưng tụi mình biết là tụi mình sẽ làm được, dù nhiều lúc còn ăn gian nộp trễ deadline nữa cơ =)))","Tự dưng mình nhận ra, động lực có thể xuất hiện trong những hình hài nhỏ bé, như một bữa tiệc sau thi, một chầu sinh tố cà rốt, một buổi karaoke xập xình với các anh chị em bạn dì, nhưng lại mang sức mạnh to lớn, thúc đẩy tụi mình chạy và chạy nhanh về phía trước. Biết ơn vì mình đã gặp được những người bạn thật giỏi ở đại học này, và trải qua những tháng ngày vô cùng đáng nhớ. Trước khi gặp mọi người, mình chỉ sống vì mình thôi, mình nuông chiều bản thân lắm, thấy khó, thấy stress là chưa chắc đã cố thế đâu. Nhưng gặp được mọi người, bị thúc đẩy bởi năng lượng tích cực của mọi người, (dù nhiều lúc cũng chầm zn =)) mình lại thấy bản thân phải cố gắng hơn nữa, cũng không đến nỗi phải thành đạt tiền tỷ, chỉ là để cảm thấy mình được sống, được làm việc, và đạt được niềm vui khi cùng nhau trưởng thành mỗi ngày. Cám ơn mọi người nhiều nhiều nhiều <3","Dạo này mình cũng chạy deadline đó, nhưng không còn vừa chạy vừa chơi với các bạn được nữa rồi. Mình lại nhớ mọi người quá. Mong là dịch mau mau hết, để tụi mình còn sớm gặp nhau.","Còn giờ thì mình không thể trốn việc nữa rùii, tạm biệt các bạn nha."]},{"s":"nhung-quyen-sach-thay-doi-cuoc-doi-minh-books-th","t":"Những quyển sách thay đổi cuộc đời mình - Books that changed my life","d":"2021-08-26","c":"books","p":["Chào mọi người, như đã hứa thì tuần này mình sẽ quay trở lại với một post mới. Và ta-da!","Hôm nay mình viết về những quyển sách đã thay đổi cuộc đời mình (hoặc phần nào thay đổi) nha. Mặc dù mình không đọc sách quá nhiều vì mình cũng khá lười í, nhưng dạo trước thì mình có nhiều thời gian để chăm chút cho bản thân nên cũng may mắn đọc được nhiều quyển khá có giá trị với mình, và cũng học được nhiều thứ để thay đổi nữa.","Trong list này thì mình sẽ đề cập theo thứ tự ưu tiên nha, tổng cộng mình chỉ nghĩ đến 3 quyển thôi nên mong là post này sẽ ngắn gọn, xúc tích một xíu.","Quyển sách đầu tiên, và cũng là quyển sách ảnh hưởng đến mình nhiều nhất chính là \"7 habits of highly effective people\", tên tiếng Việt là 7 thói quen của người thành đạt, nếu mình nhớ không nhầm.","Nếu bạn nào đã đọc qua quyển này rồi thì chắc cũng sẽ recommend quyển này giống mình cho mà xem, vì giá trị của quyển này đã vượt khỏi ranh giới của selfhelp rồi í. Còn nếu mà bạn nào chưa đọc thì mình cực kì cực kì đề xuất mọi người nên đọc lắm luôn. Để tóm tắt về quyển sách này thì nó bao gồm rất nhiều những triết lí đạo đức, nhưng lại được truyền tải hết sức gần gũi và những tình huống trong sách cực kì đời thường, thực tế nên rất dễ để người đọc hiểu và thẩm thấu í.","Quyển sách không vẽ vời hoa mỹ về “cách làm người”, “cách sống” một cách rất giả trân mà hướng tới chân thiện mỹ từ trong chính bản thân của bạn. Đọc xong mình cảm giác như mình thật sự trở nên tốt đẹp, cảm thông và quan tâm đến người khác hơn í. Có thể một số bạn cho rằng mấy quyển selfhelp như này chỉ là một viên dopamine để người đọc cảm thấy tràn đầy năng lượng và có động lực mạnh mẽ trong vài ngày rồi lại quay trở lại như cũ chứ thực chất không giúp được gì, mình cũng nghĩ thế, nhưng mình tin chắc 7 habits of highly effective people không chỉ có như thế.","Thật lòng mà nói thì mình không nhớ nhiều về những nội dung trong sách đâu vì mình mau quên lắm, nhưng bằng cách nào đó, những quan điểm, suy nghĩ của tác giả vẫn đọng lại trong lòng mình, và từng chút từng chút mở mang tầm mắt cho mình, về cách nhìn nhận vấn đề nè, cách đánh giá mọi thứ khách quan hơn, và giúp mình tư duy tốt hơn, bớt phiến diện và ác nghiệt hơn trước.","Trước đây, tư duy của mình hạn hẹp hơn nhiều, và mình chẳng biết cảm thông hay gì đâu, ích kỉ lắm. Có những thứ mình cho rằng 1 là 1, 2 là 2, và không dễ dàng chịu đón nhận các quan điểm khác biệt, dù thực tế thì đúng sai chỉ là tương đối. Thế nên nếu phải thừa nhận thì quả thật hồi nhỏ mình đã rất cứng đầu, bây giờ thì thật ra cũng thế, nhưng ít ra mình đã sẵn sàng mở lòng nhiều hơn, và tập chấp nhận rằng một câu chuyện có thể có nhiều khía cạnh khác mà mình chưa biết đến.","Dù mình vẫn chưa đọc hết quyển này, do quãng thời gian đó khá là bận rộn nên mình không duy trì được í, sau này thì không có đủ dũng cảm để đọc lại từ đầu, vì mình không thích cái gì lưng chừng, nên mình lỡ drop luôn. Nhưng trong thời gian sắp tới mình sẽ cố gắng đọc lại từng chút một, vì giờ mình thấy mình hơi bị lười rồi hic.","Quyển sách thứ hai mà mình muốn giới thiệu cho mọi người là \"Cô gái văn chương tập 1\", nhưng nếu có cơ hội mọi người nên đọc hết nguyên bộ. Mặc dù là tiểu thuyết văn chương có hơi hướng trinh thám một xíu, nhưng Cô gái văn chương là một kết hợp tuyệt vời giữa những tác phẩm cổ điển và hiện thực có phần kì ảo. Mình nhớ như in tập 1 của Cô gái văn chương vì đây chính là quyển sách đã đưa mình đến với “Thất lạc cõi người” – thêm một quyển sách recommend cho mọi người, nhưng mình sẽ nói sau.","Không bàn đến lời kể và cốt truyện, điều mà mình nhận được ở Cô gái văn chương là hiện thực. Nghe khá là khó hiểu ha, hiện thực ở đây là hiện thực ẩn sau những mặt nạ mà mọi người không thể hiện ra cho người khác thấy, những suy nghĩ, những lối sống, biểu cảm khác thường không dám để ai phát hiện. Với mình, cái khác thường đó thật đến nỗi ám ảnh, và mình nghĩ rằng bất cứ ai trong chúng ta đôi lúc đều trải qua những khoảnh khắc như thế, hoặc ít ra thì mình đã cảm thấy bản thân như thế. Mặc dù câu chuyện có mở đầu khá u ám, nhưng kết thúc lại mang đến một cảm giác vô cùng ấm áp.","Như kiểu, bất cứ ai cũng có quyền hạnh phúc, dù cho khác biệt đến đâu, và dù khác biệt đến đâu, thì chúng ta vẫn là con người, hoặc ít ra sẽ luôn có những người nhìn nhận mình như thế.","Để hiểu hơn về câu chuyện này thì mình nghĩ “Thất lạc cõi người” sẽ là một quyển sách sâu sắc hơn, nhưng có thể cũng u ám hơn “Cô gái văn chương tập 1”, tuỳ cảm nhận mà mọi người lựa chọn nhé. Cá nhân mình thì vẫn thích Cô gái văn chương 1 hơn, vì điểm kết của nó khá là Happy Ending với mình, còn Thất lạc cõi người thì chân thật quá, ám ảnh mình hơn nhiều, dù rất hay nhưng mình vẫn không dám đọc lại vì sợ bị cuốn vào í.","À, và lí do mà quyển sách này thay đổi cuộc sống của mình í hả? Vì mình thấy được bản thân của mình trong câu chuyện, và vì mình cũng từng có những cảm xúc như thế, nên mình bị nhập tâm hơn í. Thế nên dường như cái kết đã nhen nhóm trong lòng mình chút gì đó, ấm áp, tựa ngọn lửa ngày đông ấy, và giữ cho mình chút hơi đến tận bây giờ, dù nhiều lúc cuộc sống với mình cũng khá là bế tắc. Mình nghĩ đó là hi vọng nhỉ? Hi vọng rằng dù khác biệt, đâu đó vẫn sẽ có người chấp nhận mình, hoặc là nhờ hi vọng đó, mình dần dần chấp nhận bản thân mình chăng?","Quay lại chủ đề nè, quyển sách thứ 3, và chắc cũng là quyển sách cuối cùng rồi, mà mình muốn giới thiệu cho mọi người, chính là một quyển sách vô cùng vô cùng nổi tiếng “Rừng Na Uy”.","Xin không review thêm nhiều vì đã có quá nhiều review về quyển sách này rồi. Nhưng nếu nói lí do vì sao quyển sách này thay đổi cuộc đời mình á, mình nghĩ là nó đã tô điểm cho nhận thức của mình rất rất nhiều. Có khá nhiều câu trích dẫn hay trong quyển sách, thật lòng thì mình cũng chả nhớ được câu nào đâu, nhưng mình nhớ từng giai đoạn trong câu chuyện của nam chính, và cái kiểu suy nghĩ lúc sâu lúc nông của cậu ta làm mình đôi lúc cảm thấy chả thể hiểu được.","Well, với mình thì cái “chả thể hiểu được” đó, chính là điểm làm mình ấn tượng, không chỉ mỗi nhân vật chính, mà ngay cả các nhân vật khác đều như vậy. Vì thực ra thì là con người, ai chẳng có những lúc như thế. Mỗi người một câu chuyện, và mình chẳng thể nào phán xét xem một người đã làm đúng hay sai, vì mình vốn không ở trong câu chuyện đó, không trải qua những suy nghĩ đó, và cũng chẳng chịu trách nhiệm cho cuộc sống đó. Thế nên, dù khó hiểu thật đấy, nhưng mình lại cảm thấy, mình hiểu.","Nó không đúng với luân thường đạo lí chút nào đâu, cho những bạn có ý định đọc qua. Nhưng nó thật. Và nó thật đến đau lòng. Mình học được nhiều từ Rừng Na Uy lắm, và quyển sách giúp mình sáng mắt ra nhiều, tại thời điểm mà mình đang loay hoay với những suy nghĩ bừa bộn của mình. Nên đôi lúc nghĩ về Rừng Na Uy, mình vẫn cứ cảm thấy đau đáu với những cuộc đời trong trang sách.","Mải viết xém chút mình quên đoạn kết luôn. Tóm tắt lại thì có 3 quyển sách đã góp phần thay đổi cuộc đời mình, bao gồm:","7 habits of highly effective people","Cô gái văn chương tập 1","Rừng Na Uy","Và xem thêm Thất lạc cõi người nếu bạn thích nhó. Mong là chia sẻ của mình sẽ hữu ích cho bạn nào đang muốn tìm một quyển sách giá trị để đọc trong mùa dịch nè, và nhớ đón chờ những bài viết tiếp theo của mình nha.","Chúc mọi người cuối tuần vui vẻ <3"]},{"s":"dua-con-cua-may-man","t":"Đứa con của may mắn","d":"2021-08-20","c":"diary","p":["Hello mọi người,","Buồn cười lắm, bình thường mình có rất nhiều thứ để viết cơ, nhưng hễ cứ buộc mình phải nghĩ một chủ đề hay hay để viết thì mình lại chẳng biết bắt đầu như thế nào. Nhưng mà vì blog mình chưa có bài viết nào hết, nên trước mắt mình sẽ viết nhật kí một chút cho ngày hôm nay vậy.","Điểm nhấn của hôm nay là mình được khen đó. Trùi ui mình không kể hết được mình vui đến thế nào chỉ với vài dòng chữ được, nhưng nếu mà các bạn gặp mình bây giờ thì chắc hẳn mình đang vừa nói câu đó vừa vẫy tay liên tục í. Thật là muốn để đống icon mặt cười vào đây mà tự nhủ mình phải nghiêm túc, nên thui, teencode thôi là được rồi.","Quay lại với câu chuyện, mình được khen vì đã nghiêm túc viết một bài blog hoàn chỉnh, rõ ràng, dễ hiểu và đầu tư sau khi được chị mentor review chi tiết. Điều làm mình hạnh phúc nhất là chị không những tuyên dương mình trước mặt mọi người mà chị còn nhấn mạnh suốt 1 tháng rưỡi vừa qua thì mình là người duy nhất đạt chỉ tiêu viết blog trong 3 bạn. Điều này làm mình muốn khóc vì vui luôn á thật sự huhuhu.","Thật sự thì niềm vui này đã vượt quá sự kì vọng của mình. Suốt quãng thời gian thực tập, mình cứ nghĩ rằng mình thật sự lười biếng chết đi được, toàn đợi sát deadline mới chạy, lại còn ỷ y, nhiều lúc làm cũng làm việc qua loa nữa. Ngay cả với bài blog vừa được khen này, mình cũng cảm thấy bản thân mình chưa đủ đầu tư, thế mà lại được khen, với mình đây quả là một sự may mắn bất ngờ, vui không tả được, mà đâu đó vẫn len lỏi chút cảm giác tội lỗi vì chưa đủ cố gắng.","Niềm vui thứ hai, cũng đến từ công việc của mình, là mình sắp được làm Landing Page rồi. Hic phải nói là mình hạnh phúc thật sự luôn í, nghĩ tới cảnh được mở wordpress lên xong dành cả ngày để mò mẫm mấy cái tool, kéo kéo thả thả rồi chỉnh chỉnh, mày mò gặp lỗi rồi tìm cách sửa cho đến khi nhìn thấy website của mình hoàn thiện, sướng rơn. Sướng như sắp được gặp crush vậy á. Khum coá từ ngữ nào tả được.","Nhiều lúc ngẫm nghĩ, mình vẫn cảm thấy mình thật sự là đứa con của may mắn. Dù cho mình có lười biếng đến đâu, vô ý hay chủ quan đến đâu, may mắn, vẫn ở bên cạnh mình. Không biết là do mình nghĩ thế thôi, hay thật sự như thế thật, nhưng mình luôn biết ơn những điều kì diệu này, nhỏ có, lớn có. Nhưng các bạn biết không, mình vẫn tin vào luật hấp dẫn ấy, Paulo Coelho cũng đã từng nhắc đến trong quyển sách Nhà giả kim của mình: \"Khi bạn khao khát một điều gì đó, cả vũ trụ sẽ hợp lực giúp bạn đạt được điều đó.\" Thế nên khi mình tin bản thân mình may mắn, cảm giác như may mắn sẽ thật sự tới với mình ý. Không phải vì mình may mắn mà mình tin, mà vì mình tin nên mình may mắn. Người ta vẫn hay nói kiểu thế nhỉ?","Hmm, sẵn đã nói về luật hấp dẫn rồi, mình cũng muốn nói thêm một xíu. Thật ra thì mặc dù có nhiều ý kiến xoay quanh vấn đề này, nhưng vì nó cũng chỉ là một giả thuyết thôi, nên mình không dám suy xét đúng sai. Mình chỉ đơn thuần nghĩ, thế giới của mình như thế nào, đều là do mình quyết định. Mình nghĩ rằng thế giới của mình tràn đầy hạnh phúc, thì dù cho có gặp khó khăn, vất vả, mình luôn tìm thấy những điều hạnh phúc nho nhỏ ở đó. Còn nếu mình tin rằng thế giới là một màu xám, toàn những chuyện đau khổ, bất công, thì dù bên cạnh mình là niềm vui, là bạn bè, gia đình luôn quan tâm, support, mình vẫn sẽ cảm thấy không đủ, không phải thứ mình muốn.","Suy cho cùng đây cũng chỉ là quan điểm của mình. Thế nên như mình vẫn luôn nói \"Smile more, live fulfilly\", mình phải vui trước, thì thế giới của mình mới vui được.","Thế thôi. Chúc mọi người một buổi tối nhiều niềm vui nha.","Smile more, live fulfilly.","Gracie."]},{"s":"about-me","t":"About Me","d":"2021-08-17","c":"diary","p":["Chào mọi người mình là Duyên, nhưng mọi người có thể gọi mình là Grace hoặc Gracie như một cách gọi thân mật nha.","Khác với những cây viết chuyên nghiệp về một chủ đề cụ thể, mình viết blog chủ yếu để ghi lại những cảm xúc, suy nghĩ và những bài học mà mình tích luỹ được trong hành trình trưởng thành.","Mình sinh ra và lớn lên tại Sài Gòn, một thành phố khá náo nhiệt và bận rộn. Nhưng trước guồng quay chóng mặt của Sài Gòn, mình lại sống có phần khép kín và chậm chạp. Vì gia đình mình cũng chỉ vừa đủ ăn đủ mặc nên từ nhỏ mình đã rèn luyện bản thân tỉnh táo trước những cám dỗ xung quanh, không học đòi cái này cái nọ, phân biệt được cái nào vòi được cái nào không. Dần dần, mình lớn lên và biết đến triết lí sống tối giản, cùng mẹ nghe thuyết pháp mỗi ngày, để ngày càng nhận ra thế nào là \"đủ\", và tìm thấy hạnh phúc với những gì mình có.","Mình nghĩ đó là một điều may mắn với mình. Và mình cũng muốn lan toả may mắn đó đến mọi người, đến những bạn đang đọc những dòng này, mong là các bạn sẽ tìm thấy niềm vui từ chính bản thân bạn, bởi vì bản thân bạn đã là một điều kì diệu rồi.","About \"Hôm nay mình viết\"","Hôm nay mình viết là chắc là một cụm từ quen thuộc với mọi người đúng hong? Với mình, dường như mỗi khi cầm bút lên, mình luôn mở đầu bằng \"Hôm nay mình viết...\". Tên blog cũng được ra đời như thế.","Một ngày đầu hạ năm 2021, mình chợt nghĩ đến việc viết một chiếc blog nghiệp dư để từng bước xây dựng profile của mình. Nhân tiện nói sơ qua một chút, mình hiện tại là sinh viên Marketing, thế nên với mình có một profile cá nhân siêu xịn xò (hoặc xịn vừa vừa thôi) là một bước đệm hoàn hảo bổ sung cho CV. Nhưng rồi mình nhận ra, chỉ viết về Marketing thôi thì chắc chưa đã cái nư của mình. Cuối cùng, thay vì chọn một cái tên thật kêu như \"Marketing With Duyên\" - cái tên mà mình đã chuẩn bị build cho facebook và instagram, thì mình đã quyết định bước từng bước nhỏ với \"Hôm nay mình viết\". Nhưng nếu một ngày bạn có tình cờ thấy \"Marketing With Duyên\" xuất hiện thì cũng đừng ngạc nhiên nhé vì có thể mình sẽ vẫn thực hiện dự định đó để đào sâu hơn về Marketing nè.","Dù vậy, đừng vì thế mà nghĩ \"Hôm nay mình viết\" sẽ toàn những chuyện trên trời dưới đất nhé, oan cho mình lắm cơ. Mình lập blog, một phần là vì bản thân thật, mình không phủ nhận, nhưng ý định chính của mình vẫn là tạo ra một thế giới nhỏ để chia sẻ tất cả mọi thứ mình biết, không chỉ về Marketing, mà còn về những khía cạnh khác trong cuộc sống thường nhật, làm thế nào để hoàn thiện bản thân mỗi ngày và làm thế nào để trở nên hạnh phúc (dù hạnh phúc là điều mà mỗi người phải tự chiêm nghiệm được).","Mình nghĩ, bất kì ai cũng đều có khả năng làm điều mình muốn, bởi lẽ:","Nếu muốn, bạn sẽ tìm cách,","Nếu không muốn, bạn sẽ tìm lí do\"","Dù đôi khi có vẻ hơi sáo rỗng, nhưng với mình, câu nói ấy vẫn là kim chỉ nam giúp mình hướng tới mục tiêu.","Mình chưa bao giờ nghĩ mình sẽ thật sự chăm chỉ viết blog, hay làm điều gì đó \"thường xuyên\", trừ ăn và ngủ, bởi ở cái tuổi trưởng thành này, mình nhận thức được mình vô cùng lười biếng, so với các bạn cùng lứa. Nhưng peer pressure chưa bao giờ cản bước mình, cũng chưa bao giờ thật sự là động lực. Chỉ đến khi mình nhận ra được ý nghĩa trong việc mình làm, mình mới thật sự cảm thấy hạnh phúc, và niềm vui đó, mỗi khi mình ngẫm lại, đều thúc đẩy mình tiến lên từng ngày. Một cách nhẹ nhàng, an yên.","Chỉ đến khi bắt đầu, mình mới có thể bước tiếp. Bản thân mình chưa bao giờ tìm kiếm triết lý sống nào, cũng không đánh giá bất kì quan điểm nào là hay, dở, nên hay không nên. Mọi câu chuyện đều có những context riêng, thế nên với mình, \"Smile more, live fulfilly\" là điều mình luôn nhắn nhủ với bản thân.","Chỉ cần mỉm cười và sống hết mình, thế là đủ.","Duyên."],"q":"Một ngày đầu hạ năm 2021, mình chợt nghĩ đến việc viết một chiếc blog nghiệp dư"}];

vec3 c=mix(deep,mid,smoothstep(.28,.52,n2));c=mix(c,lite,smoothstep(.5,.68,n2));

c+=smoothstep(.56,.62,n3)*smoothstep(.45,.6,n2)*.16;
float g=smoothstep(.66,.7,n2+h*.3);float tw=pow(ns(gl_FragCoord.xy*.22+uT*3.),8.);

vec3 nt=vec3(.05,.12,.14)+c*vec3(.16,.27,.31)+g*tw*vec3(.75,.8,.7);
c=mix(c,nt,uN);gl_FragColor=vec4(c,1.);}`;

/* ---------- routing ---------- */

  if (h === "ke-sach") scene = h;
  else if (h.startsWith("sach-") && BOOKS.includes(h.slice(5))){ scene = "sach"; arg = h.slice(5); }
  else if (h.startsWith("bai-")){ const p = POSTS.find(x => x.s === h.slice(4)); if (p){ scene = "sach"; arg = bookOf(p); slug = p.s; } }
  const go = () => {
    document.body.dataset.scene = scene;
    $$(".scene").forEach(s => s.classList.toggle("on", s.id === "s-" + scene));
    $$(".top nav a").forEach(a => a.dataset.nav === (scene === "sach" || scene === "ke-sach" ? "viet" : scene) ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));

    $("#form").hidden = true; $$(".gay.ra").forEach(g => g.classList.remove("ra"));
    if (scene === "sach") openBook(arg, slug);

  wash.firstChild.animate([{transform:"translate(-46vw,12vh) rotate(0deg) scale(.7)"},{transform:"translate(46vw,-8vh) rotate(200deg) scale(1.1)"}], {duration:1100, easing:"cubic-bezier(.3,0,.3,1)"});

$("#gay").addEventListener("click", e => { const g = e.target.closest(".gay"); if (g) g.classList.add("ra"); });
(function(){
  const h = (location.hash || "").slice(1); if (still || (h && h !== "nuoc")) return;
  const rem = document.createElement("div"); rem.id = "rem"; rem.setAttribute("aria-hidden","true");
  const r = rng(314), gr = ["#3F6B3A","#5E8E4E","#7FAE62","#4F7F45","#95C277","#2F5630"]; let html = "";
  ["t","p"].forEach(side => { let d = "";
    for (let k = 0; k < 15; k++){ const x = (k + .2 + r()*.6) / 15 * 100, len = innerHeight * (.72 + r()*.4); let lv = "";

        lv += `<i style="top:${y|0}px;height:${lh|0}px;background:${gr[(r()*6)|0]};transform:rotate(${(sd*(14 + r()*30))|0}deg);opacity:${(.78 + r()*.22).toFixed(2)}${r() < .22 ? ";filter:blur(2px)" : ""}"></i>`; }
      d += `<div class="day" style="left:${x.toFixed(1)}%;height:${len|0}px;--a:${(-1.5 - r()*2).toFixed(1)}deg;--b:${(1.5 + r()*2.5).toFixed(1)}deg;animation-duration:${(4.5 + r()*4).toFixed(1)}s;animation-delay:-${(r()*5).toFixed(1)}s">${lv}</div>`; }

  setTimeout(() => rem.classList.add("mo"), 1100);

(function(){
  let ac = null, on = false, tm = 0; const N = [293.66,329.63,369.99,440,493.88,587.33,659.25,739.99];
  const note = (f, v) => { const t = ac.currentTime, g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 3.4); g.connect(ac.destination);
    [["triangle",1,1],["sine",2,.3]].forEach(([ty, mul, lv]) => { const o = ac.createOscillator(), og = ac.createGain(); o.type = ty; o.frequency.value = f * mul; og.gain.value = lv; o.connect(og); og.connect(g); o.start(t); o.stop(t + 3.5); }); };
  const play = () => { if (!on) return; const i = (Math.random() * N.length) | 0; note(N[i], .07); if (Math.random() < .35) setTimeout(() => on && note(N[(i + 2) % N.length] / 2, .05), 260); tm = setTimeout(play, 1500 + Math.random() * 2200); };
  $("#dan").onclick = function(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); on = !on; this.setAttribute("aria-pressed", String(on)); clearTimeout(tm); if (on){ ac.resume(); play(); } } catch(e){ on = false; this.setAttribute("aria-pressed","false"); } };
  const oc = $("#o-cua"); if (oc){ const r = rng(88), gr = ["#7FAE62","#95C277","#5E8E4E","#B7D27E","#A9D07C"]; let h = "";

  oc.insertAdjacentHTML("beforeend", h);
  }
  if ($("#hop-thu")){

(function(){
  const c = $("#mua"), x = c.getContext("2d"); let drops = [], raf = 0, lt = 0, W = 0, H = 0;
  const size = () => { const d = Math.min(devicePixelRatio || 1, 2); W = c.clientWidth; H = c.clientHeight; c.width = W * d; c.height = H * d; x.setTransform(d,0,0,d,0,0);
    const n = Math.round(W * H / 5200); drops = Array.from({length:n}, () => mk(true)); };
  const mk = any => { const z = Math.random(); return {x:Math.random() * (W + 120) - 20, y:any ? Math.random() * H : -40 - Math.random() * 200, z, len:8 + z * 16, v:150 + z * 230, a:.35 + z * .65, w:.7 + z * 1.1, sp:0}; };

      d.y += d.v * dt; d.x -= d.v * dt * .1;
      x.strokeStyle = `rgba(238,245,250,${d.a})`; x.lineWidth = d.w; x.beginPath(); x.moveTo(d.x, d.y); x.lineTo(d.x + d.len * .13, d.y - d.len); x.stroke();
      if (d.y > H * (.55 + d.z * .45)){ if (d.z > .55 && Math.random() < .6) d.sp = .28; else drops[i] = mk(false); } }

  const sync = () => { const on = document.body.dataset.scene === "sach" && $("#s-sach").classList.contains("mua") && !still;
    if (on && !raf){ size(); lt = performance.now(); raf = requestAnimationFrame(tick); } else if (!on && raf){ cancelAnimationFrame(raf); raf = 0; } };
  new MutationObserver(sync).observe($("#s-sach"), {attributes:true, attributeFilter:["class"]});
  new MutationObserver(sync).observe(document.body, {attributes:true, attributeFilter:["data-scene"]});
  addEventListener("resize", () => { if (raf) size(); });
})();
addEventListener("hashchange", route);
