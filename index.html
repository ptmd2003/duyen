<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyên, một buổi sáng có nắng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Mynerve&family=Lora:ital@0;1&family=Playfair+Display:ital@0;1&family=Josefin+Sans:wght@400;600&family=Quicksand:wght@500&family=Prata&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Spectral:ital@0;1&family=Shippori+Mincho:wght@500&display=swap">
<style>
/* layout: one screen, five surfaces (water, wall, paper, garden, window); one light falls on all of them */
:root{
  --ink:#1F3323; --paper:#F6F1E1; --paper-2:#FBF8EC; --leaf:#3F5C3B; --grass:#74A659; --water:#A8CDB2;
  --sun:#FFF7C2; --lilac:#B9A8E6; --pink:#F7BECB; --cream:#F4F7E8;
  --f-display:"EB Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Mynerve","Be Vietnam Pro",system-ui,sans-serif;
  --fg:var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#A8CDB2;color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
h1,h2,h3,p{margin:0}
em{font-style:italic}

body[data-scene="sach"],body[data-scene="vuon"],body[data-light="toi"]{--fg:var(--cream)}
body[data-scene="vuon"]{--fg:var(--sun)}

.scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.scene.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.deco{position:absolute;inset:0;pointer-events:none}

/* header */
.top{position:absolute;z-index:30;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px clamp(18px,5vw,72px);color:var(--fg);transition:color .6s}
.brand{font-family:var(--f-display);font-size:34px;letter-spacing:-.01em;text-decoration:none;line-height:1}
.top nav{display:flex;gap:2px}
.top nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 clamp(10px,1.6vw,18px);font-size:16px;text-decoration:none;text-underline-offset:6px}
.top nav a[aria-current="page"]{text-decoration:underline}
.top nav a[hidden]{display:none}

h1.big{font-family:var(--f-display);font-weight:400;font-size:clamp(44px,7vw,92px);line-height:.96;letter-spacing:-.025em;text-wrap:balance;color:var(--fg);transition:color .6s}

/* light */
#anhsang{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity 1.2s}
body[data-light="chieu"] #anhsang{opacity:1;background:radial-gradient(120% 90% at 88% 6%,rgba(255,206,120,.34),rgba(255,190,120,.12) 55%,rgba(255,170,100,.06))}
body[data-light="toi"]:not([data-scene="nuoc"]) #anhsang{opacity:1;background:radial-gradient(62% 58% at 50% 54%,rgba(8,20,24,0) 0%,rgba(8,20,24,.5) 58%,rgba(6,16,20,.84) 100%)}
#doi{position:absolute;z-index:31;left:clamp(14px,4vw,56px);bottom:22px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--fg);background:transparent;cursor:pointer;display:grid;place-items:center;transition:border-color .6s}
#doi i{display:block;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:box-shadow .6s,background .6s}
body[data-light="chieu"] #doi i{box-shadow:inset -6px 0 0 0 rgba(31,51,35,.45)}
body[data-light="toi"] #doi i{background:transparent;box-shadow:inset 5px -2px 0 0 var(--fg)}
#wash{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0;background:radial-gradient(90% 90% at 70% 20%,#FFFDF0 0%,#F1F7DF 55%,#DDEBCB 100%)}

/* water */
#s-nuoc{background:linear-gradient(165deg,#CFE5D3 0%,#A8CDB2 52%,#C4E0CF 100%)}
#water{position:absolute;inset:0;width:100%;height:100%;display:block}
.chao{position:absolute;left:clamp(18px,5vw,72px);top:clamp(120px,27vh,270px);width:min(600px,84vw);display:flex;flex-direction:column;gap:20px;pointer-events:none}
.chao::before{content:"";position:absolute;inset:-70px -90px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));z-index:-1;transition:opacity .8s}
body[data-light="toi"] .chao::before{opacity:0}
.eyebrow{font-size:14px;letter-spacing:.14em;color:var(--fg);transition:color .6s}
.hoa{position:absolute;display:block;text-decoration:none;color:var(--ink);will-change:transform}
.hoa .be{position:relative;display:block;flex:none}
.hoa .la-sen{position:absolute;left:0;bottom:0;width:100%;height:62%;border-radius:50%;background:#86B777;box-shadow:inset 0 -6px 10px rgba(60,110,60,.45),0 6px 14px rgba(60,110,80,.3)}
.hoa svg{position:absolute;left:50%;top:0;filter:drop-shadow(0 5px 5px rgba(40,90,50,.35))}
.nhan{position:absolute;left:100%;top:50%;display:flex;flex-direction:column;gap:3px;justify-content:center;min-height:44px;width:max-content;max-width:min(300px,52vw);padding:10px 16px;background:var(--paper-2);border-radius:3px;box-shadow:0 10px 24px rgba(50,95,70,.28);opacity:0;transform:translateY(calc(-50% + 6px));transition:opacity .5s ease,transform .5s ease}
.hoa.trai .nhan{left:auto;right:100%}
.nhan small{font-size:12px;letter-spacing:.08em;color:#4C5A41}
.nhan b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15}
.hoa:hover .nhan,.hoa:focus-visible .nhan,.hoa.gan .nhan{opacity:1;transform:translateY(-50%)}
@media (hover:none){.nhan,.hoa.trai .nhan{opacity:1;left:0;right:auto;top:100%;transform:none;max-width:44vw;padding:6px 10px;min-height:0}.hoa:hover .nhan,.hoa:focus-visible .nhan,.hoa.gan .nhan{transform:none}.nhan b{font-size:16px}.nhan small{font-size:11px}}
.canh{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(50,95,70,.3))}
.lieu{position:absolute;top:-12px;width:2px;background:#5E8E4E;opacity:.8;transform-origin:top center;animation:du 7s ease-in-out infinite alternate}
.lieu i{position:absolute;left:-4px;width:9px;border-radius:50%;transform-origin:top center}
@keyframes du{from{transform:rotate(var(--a,-3deg))}to{transform:rotate(var(--b,4deg))}}

/* leaf shadows, shared */
.bong{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;overflow:hidden}
.bong i{position:absolute;border-radius:50%;background:var(--bc,#7C936A);animation:lay 8s ease-in-out infinite alternate}
@keyframes lay{from{transform:translate(0,0) rotate(var(--r,0deg))}to{transform:translate(var(--dx,14px),var(--dy,8px)) rotate(calc(var(--r,0deg) + var(--dr,6deg)))}}
.dom{position:absolute;border-radius:50%;pointer-events:none}

/* shelf */
#s-ke-sach{background:linear-gradient(180deg,#E6EAD6 0%,#D9E0C6 100%)}
#s-ke-sach .nang{position:absolute;left:52%;top:-6%;width:42%;height:76%;background:#FFF7D6;opacity:.6;filter:blur(40px);transform:skewX(-16deg)}
#s-ke-sach h1{position:absolute;left:clamp(18px,5vw,72px);top:clamp(96px,17vh,150px);max-width:min(520px,80vw)}
.ke{position:absolute;left:0;right:0;bottom:0;height:17%;background:linear-gradient(180deg,#EEF2DF 0%,#C8D5B5 12%,#B9C9A5 100%);box-shadow:0 -10px 24px rgba(60,80,50,.18)}
.nha{margin:18px 0 0;font-family:var(--f-display);font-size:clamp(22px,2.7vw,36px);line-height:1.15;letter-spacing:-.01em}
#rem{position:fixed;inset:0;z-index:90;pointer-events:none}
#rem .canh{position:absolute;top:0;bottom:0;width:50.5%;overflow:hidden;background:rgba(214,234,208,.5);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);transition:transform 3.4s cubic-bezier(.5,0,.15,1),opacity 2.6s ease 1s}
#rem .canh.t{left:0}#rem .canh.p{right:0}
#rem.mo .canh.t{transform:translateX(-104%) skewX(3deg);opacity:.2}#rem.mo .canh.p{transform:translateX(104%) skewX(-3deg);opacity:.2}
#rem .day{position:absolute;top:-30px;width:2px;background:#4F7F45;transform-origin:top center;animation:du 6s ease-in-out infinite alternate}
#rem .day i{position:absolute;left:-7px;width:15px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;transform-origin:top center}
body.mo-dau .chao h1{animation:hien-chu 1.8s ease 2.3s both}
body.mo-dau .chao .nha{animation:hien-chu 1.8s ease 3.5s both}
body.mo-dau #hoa,body.mo-dau .top{animation:hien-mo 1.6s ease 4.4s both}
@keyframes hien-chu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes hien-mo{from{opacity:0}to{opacity:1}}
.gay-hang{position:absolute;left:50%;bottom:17%;transform:translateX(-36%);display:flex;align-items:flex-end;gap:calc(6px*var(--k,1))}
@media (max-width:820px){.gay-hang{transform:translateX(-50%)}}
.gay{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(30px*var(--k,1)) 6px calc(22px*var(--k,1));border-radius:3px;text-decoration:none;box-shadow:8px 0 14px rgba(40,60,35,.25);transition:transform .45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.gay:hover,.gay:focus-visible{transform:translateY(calc(-26px*var(--k,1)))}
.gay.ra{transform:translateY(calc(-120px*var(--k,1))) scale(1.04);transition-duration:.6s}
.gay .ten{font-family:var(--f-display);font-size:calc(19px*var(--k,1));letter-spacing:.18em;text-align:center;line-height:1.35}
.gay .ten.doc{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;letter-spacing:.14em;font-size:calc(21px*var(--k,1));padding:calc(8px*var(--k,1)) calc(4px*var(--k,1))}
.gay .ten.doc.nhan-giay{background:#FBF8EC;border-radius:2px}
.gay .vach{display:block;width:70%;height:calc(7px*var(--k,1));border-top:1px solid var(--fg);border-bottom:1px solid var(--fg);opacity:.45}
.gay{box-shadow:5px 0 10px rgba(90,80,55,.16),inset 0 0 0 1px rgba(255,255,255,.25)}
.gay .nam{font-family:var(--f-display);font-size:calc(32px*var(--k,1));line-height:1}
.gay .dang{font-size:calc(12px*var(--k,1));text-align:center;line-height:1.4}
.gay .ruy{position:absolute;top:-4px;right:18%;width:calc(12px*var(--k,1));height:calc(46px*var(--k,1));background:#C96F82;clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);transform:translateY(-60%)}

/* book */
#s-sach{background:radial-gradient(760px 520px at 82% 8%,#B7D27E 0%,rgba(183,210,126,0) 62%),linear-gradient(170deg,#6E9450 0%,#4C7340 55%,#3E6238 100%)}
.ve{position:absolute;z-index:6;left:clamp(18px,5vw,56px);top:74px;display:inline-flex;align-items:center;min-height:44px;font-size:15px;text-decoration:none;color:var(--cream)}
.book{position:absolute;left:50%;top:50%;transform:translate(-50%,-48%) rotate(-1deg);perspective:2400px;width:calc(var(--pw)*var(--n));height:var(--ph)}
.book .bia{position:absolute;inset:-9px -14px -15px;background:var(--leaf);border-radius:6px;box-shadow:0 34px 60px rgba(20,40,15,.5)}
.book .ruot{position:absolute;inset:4px -5px -6px;background:#E3DBC2;border-radius:3px}
.trang{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
.trang::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(120,105,60,0) 44%,rgba(120,105,60,.16) 50%,rgba(120,105,60,0) 56%)}
.book[data-n="1"] .trang::after{background:linear-gradient(90deg,rgba(120,105,60,.14),rgba(120,105,60,0) 9%)}
.flow{position:relative;width:var(--pw);height:var(--ph);padding:var(--pv) var(--pad);column-width:calc(var(--pw) - 2*var(--pad));column-gap:calc(2*var(--pad));column-fill:auto;font-family:var(--f-display);font-size:var(--fs,18.5px);line-height:1.55;color:#26301F}
.flow p{margin:0 0 .72em;orphans:2;widows:2;overflow-wrap:break-word}
.bai{break-before:column}
.bai h2{font-family:var(--f-display);font-weight:400;font-size:1.95em;line-height:1.06;letter-spacing:-.015em;margin:.5em 0 .55em;text-wrap:balance;break-after:avoid}
.dau{display:flex;align-items:center;gap:12px;font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:#4C5A41;break-after:avoid}
.dau span:first-child{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border:1.5px solid #6B7C5E;border-radius:50%;font-size:11px;line-height:1.2;text-align:center;letter-spacing:.06em;transform:rotate(-10deg)}
mark.hl{color:inherit;background:linear-gradient(180deg,rgba(0,0,0,0) 14%,var(--hc,#F7BECB) 14%,var(--hc,#F7BECB) 90%,rgba(0,0,0,0) 90%) no-repeat 0 0/0% 100%;transition:background-size 1.4s cubic-bezier(.3,.6,.2,1) .35s;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl.on{background-size:100% 100%}
.anh{break-inside:avoid;position:relative;width:64%;margin:1.1em auto 1.4em;transform:rotate(var(--r,2deg))}
.anh::before{content:"";position:absolute;left:34%;top:-13px;width:34%;height:24px;background:rgba(185,168,230,.8);transform:rotate(-5deg)}
.anh div{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;border:8px solid #fff;background:#C6D4B6;box-shadow:0 8px 18px rgba(50,60,30,.3);font-family:var(--f-ui);font-size:12px;letter-spacing:.1em;color:#33402B}
.nhanh{display:block;margin:.6em 0 0;break-before:avoid}
.ep{float:right;margin:-6px -8px 4px 12px;transform:rotate(var(--r,12deg));filter:drop-shadow(0 5px 4px rgba(40,50,25,.3))}
.bia-trong{display:block}
.bia-trong .so{font-size:5.2em;line-height:.9;letter-spacing:-.03em}
.bia-trong .ky{font-family:var(--f-ui);font-size:12px;letter-spacing:.2em;color:#4C5A41;margin:.9em 0 1.6em}
.muc{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.muc button{display:flex;align-items:baseline;gap:10px;width:100%;min-height:40px;padding:4px 0;border:0;background:none;text-align:left;cursor:pointer;font-family:var(--f-display);font-size:1.06em;line-height:1.2;color:#26301F}
.muc button small{flex:none;font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:#4C5A41;width:44px}
.muc button:hover span{text-decoration:underline;text-underline-offset:4px}
.flip{position:absolute;top:0;width:var(--pw);height:var(--ph);display:none;background:linear-gradient(90deg,#EDE6CF,var(--paper) 30%,#FBF8EC);box-shadow:0 0 30px rgba(40,50,25,.25);z-index:4}
.che-trang{position:absolute;top:0;width:var(--pw);height:var(--ph);overflow:hidden;background:var(--paper);z-index:4}
.che-trang .toi{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(70,58,24,.5),rgba(70,58,24,.12) 50%,rgba(70,58,24,.5));opacity:0}
.la{position:absolute;top:0;width:var(--pw);height:var(--ph);z-index:7;transform-style:preserve-3d;will-change:transform}
.dai{position:absolute;top:0;height:var(--ph);transform-style:preserve-3d;will-change:transform}
.mat{position:absolute;inset:0;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mat.sau{transform:rotateY(180deg)}
.mat .toi{position:absolute;inset:0;pointer-events:none;background:rgb(74,62,28);opacity:0}
.mat.sau{background:#F1EBD8}
.the[hidden]{display:none}
.goc{position:absolute;z-index:5;bottom:0;width:22%;height:100%;border:0;background:none;cursor:pointer}
.goc.sau{right:0}.goc.truoc{left:0}
.goc::after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid;transition:border-width .3s}
.goc.sau::after{right:0;border-width:0 0 0 0;border-color:transparent transparent #D9D0B4 transparent}
.goc.sau:hover::after,.goc.sau:focus-visible::after{border-width:0 0 34px 34px}
.goc.truoc::after{left:0;border-width:0 0 0 0;border-color:transparent transparent #D9D0B4 transparent}
.goc.truoc:hover::after,.goc.truoc:focus-visible::after{border-width:0 34px 34px 0}
.goc[disabled]{display:none}
.giay{position:absolute;z-index:7;width:190px;padding:14px 16px;background:#FFFDF2;box-shadow:0 10px 20px rgba(30,45,20,.35);font-family:var(--f-hand);font-size:17px;line-height:1.35;color:#26301F;transform:rotate(var(--r,-4deg));animation:roi .7s cubic-bezier(.2,.8,.2,1) both;overflow-wrap:break-word}
.giay:nth-child(even){background:#EAF2DA}
.giay small{display:block;margin-top:8px;font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;color:#4C5A41}
@keyframes roi{from{opacity:0;transform:translateY(-30px) rotate(calc(var(--r,-4deg) - 10deg))}}
.duoi{position:absolute;z-index:8;left:clamp(74px,9vw,120px);right:clamp(14px,4vw,56px);bottom:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.nut{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--paper-2);color:#26301F;font-size:15px;cursor:pointer;text-decoration:none}
.nut.dam{background:#26301F;color:var(--paper-2);font-weight:500}
.nut[hidden]{display:none}
#so-trang{font-size:13px;letter-spacing:.12em;color:var(--cream);margin-right:auto}
#form{position:absolute;z-index:9;right:clamp(14px,4vw,56px);bottom:84px;width:min(340px,calc(100vw - 28px));padding:20px;background:#FFFDF2;box-shadow:0 20px 40px rgba(20,40,15,.45);display:flex;flex-direction:column;gap:10px;transform:rotate(1deg)}
#form[hidden]{display:none}
#form label{font-size:13px;font-weight:500}
#form input[type=text],#form textarea{width:100%;padding:10px 12px;border:1px solid #6B7C5E;background:#fff;color:#26301F;font-family:var(--f-ui);font-size:16px}
#form textarea{font-family:var(--f-hand);font-size:17px;resize:none}
#form .chon{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;font-weight:400}
#form p{font-size:13px;line-height:1.45;color:#4C5A41}
#form p[role=alert]{color:#8A2E3C}

/* garden */
#s-vuon{background:radial-gradient(700px 420px at 70% 55%,#C9E29A 0%,rgba(201,226,154,0) 64%),linear-gradient(180deg,#8FBB6C 0%,#74A659 45%,#568A4A 100%)}
#s-vuon .tan{position:absolute;left:-6%;top:-6%;width:62%;height:36%;border-radius:40%;background:#274527;opacity:.86;filter:blur(34px)}
#s-vuon .than{position:absolute;border-radius:40px;background:#3B2E22;filter:blur(1.5px)}
.vuon-trong{position:absolute;inset:0;overflow-y:auto;padding:clamp(96px,15vh,120px) clamp(18px,5vw,72px) 110px}
.gia-hang{display:flex;flex-wrap:wrap;gap:34px 26px;align-items:flex-start;margin-top:clamp(28px,6vh,60px);max-width:1180px}
.gia{position:relative;width:236px;padding:0 0 120px;border:0;background:none;text-align:left;cursor:pointer;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.gia:nth-child(even){margin-top:46px}
.gia:hover,.gia:focus-visible{transform:translateY(-8px) rotate(-.6deg)}
.gia::before,.gia::after{content:"";position:absolute;top:190px;width:7px;height:150px;background:#9C7647;z-index:0}
.gia::before{left:30%;transform:rotate(9deg)}.gia::after{right:30%;transform:rotate(-9deg)}
.khung{position:relative;z-index:1;display:flex;flex-direction:column;gap:9px;min-height:214px;padding:16px 18px;background:var(--paper-2);border:7px solid #C9A56B;box-shadow:0 16px 26px rgba(30,60,25,.38);transform:rotate(var(--r,-1deg));color:#26301F}
.khung h3{font-family:var(--f-display);font-weight:400;font-size:27px;line-height:1.04}
.khung p{font-size:14px;line-height:1.5;color:#3A4633}
.the{align-self:flex-start;padding:3px 9px;border:1.5px solid #26301F;font-size:12px;font-weight:500}
.the.dung{background:#26301F;color:var(--paper-2)}
.gia.uom .khung{background:#F3F6E4;border:2px dashed #56704A}
.gia.uom .the{border-style:dashed}
.gia.uom::after{display:none}.gia.uom::before{left:50%;transform:none;height:110px}
.cam{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;max-width:1180px}
